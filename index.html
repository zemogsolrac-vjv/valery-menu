<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Menú</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #faf7f2; color: #2b2320; }
  header { position: sticky; top: 0; z-index: 10; background: #2b2320; color: #fff; padding: 16px 16px 12px; text-align: center; }
  header h1 { margin: 0; font-size: 20px; font-weight: 700; }
  header .branch { margin: 2px 0 10px; font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.75); }
  .langs { display: flex; gap: 6px; overflow-x: auto; justify-content: center; padding-bottom: 2px; }
  .langs button { flex: 0 0 auto; border: 1px solid rgba(255,255,255,0.35); background: transparent; color: #fff; padding: 6px 12px; border-radius: 999px; font-size: 13px; }
  .langs button.active { background: #fff; color: #2b2320; font-weight: 600; }
  main { max-width: 640px; margin: 0 auto; padding: 12px 16px 48px; }
  .category { margin: 22px 0 10px; font-size: 15px; letter-spacing: 0.06em; text-transform: uppercase; color: #a9623a; font-weight: 700; }
  .item { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid #ece4d8; }
  .item img { width: 64px; height: 64px; border-radius: 10px; object-fit: cover; flex-shrink: 0; background: #ece4d8; }
  .item-body { flex: 1; min-width: 0; }
  .item-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .item-name { font-weight: 600; font-size: 15px; }
  .item-price { font-weight: 700; font-size: 15px; white-space: nowrap; color: #a9623a; }
  .item-desc { margin-top: 3px; font-size: 13px; color: #6b6058; line-height: 1.35; }
  .empty, .loading { text-align: center; padding: 60px 20px; color: #8a8078; }
</style>
</head>
<body>
<header>
  <h1 id="companyName">Menú</h1>
  <div class="branch" id="branchName" style="display:none"></div>
  <div class="langs" id="langs"></div>
</header>
<main id="main"><div class="loading">Cargando menú…</div></main>
<script>
  var SUPABASE_URL = 'https://losbulvhmemptrdjygpu.supabase.co';
  var ANON_KEY = 'sb_publishable_PqNnPS4GKsdJDSn2JtI1oQ_ecsozI1R';
  var LANGS = {"es":"Español","en":"English","fr":"Français","de":"Deutsch","zh":"中文"};
  var ITEMS = [];

  var params = new URLSearchParams(location.search);
  var companyId = params.get('company_id');
  var storeId = params.get('store_id');

  var stored = null;
  try { stored = localStorage.getItem('menuLang'); } catch (e) {}
  var current = stored && LANGS[stored] ? stored : (navigator.language || 'es').slice(0, 2);
  if (!LANGS[current]) current = 'es';

  function fieldFor(item, prefix) {
    var v = item[prefix + '_' + current];
    if (v && String(v).trim().length > 0) return v;
    return item[prefix + '_es'] || '';
  }

  function renderLangs() {
    var langsEl = document.getElementById('langs');
    langsEl.innerHTML = '';
    Object.keys(LANGS).forEach(function (code) {
      var btn = document.createElement('button');
      btn.textContent = LANGS[code];
      if (code === current) btn.className = 'active';
      btn.onclick = function () {
        current = code;
        try { localStorage.setItem('menuLang', code); } catch (e) {}
        renderLangs();
        renderItems();
      };
      langsEl.appendChild(btn);
    });
  }

  function renderItems() {
    var main = document.getElementById('main');
    main.innerHTML = '';
    if (!ITEMS.length) {
      var empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'El menú todavía no tiene platos publicados.';
      main.appendChild(empty);
      return;
    }

    var byCategory = {};
    var order = [];
    ITEMS.forEach(function (item) {
      var cat = item.category || 'General';
      if (!byCategory[cat]) { byCategory[cat] = []; order.push(cat); }
      byCategory[cat].push(item);
    });

    order.forEach(function (cat) {
      var h = document.createElement('div');
      h.className = 'category';
      h.textContent = cat;
      main.appendChild(h);

      byCategory[cat].forEach(function (item) {
        var row = document.createElement('div');
        row.className = 'item';

        if (item.image_url) {
          var img = document.createElement('img');
          img.src = item.image_url;
          img.loading = 'lazy';
          img.alt = '';
          row.appendChild(img);
        }

        var body = document.createElement('div');
        body.className = 'item-body';

        var top = document.createElement('div');
        top.className = 'item-top';
        var name = document.createElement('div');
        name.className = 'item-name';
        name.textContent = fieldFor(item, 'name');
        top.appendChild(name);
        if (item.price !== null && item.price !== undefined) {
          var price = document.createElement('div');
          price.className = 'item-price';
          price.textContent = Number(item.price).toFixed(2).replace('.', ',') + ' €';
          top.appendChild(price);
        }
        body.appendChild(top);

        var desc = fieldFor(item, 'description');
        if (desc) {
          var descEl = document.createElement('div');
          descEl.className = 'item-desc';
          descEl.textContent = desc;
          body.appendChild(descEl);
        }

        row.appendChild(body);
        main.appendChild(row);
      });
    });
  }

  if (!companyId) {
    document.getElementById('main').innerHTML = '<div class="empty">Falta el identificador de la empresa en el enlace.</div>';
  } else {
    var apiUrl = SUPABASE_URL + '/functions/v1/public-menu?company_id=' + encodeURIComponent(companyId);
    if (storeId) apiUrl += '&store_id=' + encodeURIComponent(storeId);

    fetch(apiUrl, { headers: { apikey: ANON_KEY, Authorization: 'Bearer ' + ANON_KEY } })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (data.error) {
          document.getElementById('main').innerHTML = '<div class="empty">' + data.error + '</div>';
          return;
        }
        document.title = (data.company_name || 'Menú') + ' · Menú';
        document.getElementById('companyName').textContent = data.company_name || 'Menú';
        if (data.branch_name) {
          var b = document.getElementById('branchName');
          b.textContent = data.branch_name;
          b.style.display = '';
        }
        ITEMS = data.items || [];
        renderLangs();
        renderItems();
      })
      .catch(function () {
        document.getElementById('main').innerHTML = '<div class="empty">No se pudo cargar el menú. Comprueba tu conexión.</div>';
      });
  }
</script>
</body>
</html>
