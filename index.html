<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Menú</title>
<style>
  :root {
    color-scheme: light;
    --accent: #c0392b;
    --accent-soft: #fdece7;
    --bg: #f6f2ec;
    --card-bg: #ffffff;
    --text: #2b2320;
    --muted: #8a8078;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); }

  header { position: sticky; top: 0; z-index: 20; background: #2b2320; color: #fff; padding: 14px 16px 10px; text-align: center; }
  header .logo { max-height: 44px; max-width: 160px; object-fit: contain; margin-bottom: 6px; border-radius: 8px; }
  header h1 { margin: 0; font-size: 18px; font-weight: 700; }
  header .branch { margin: 2px 0 8px; font-size: 12px; font-weight: 500; color: rgba(255,255,255,0.7); }
  .lang-picker { display: flex; justify-content: center; align-items: center; gap: 8px; padding-bottom: 2px; }
  .lang-picker select {
    appearance: none; -webkit-appearance: none; -moz-appearance: none;
    border: 1px solid rgba(255,255,255,0.35); background: rgba(255,255,255,0.06) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6" viewBox="0 0 10 6"><path d="M0 0l5 6 5-6z" fill="%23ffffff"/></svg>') no-repeat right 10px center;
    color: #fff; padding: 6px 28px 6px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 600;
  }
  .lang-picker select:focus { outline: 1px solid #fff; }
  .lang-picker option { color: #2b2320; }
  .contact-links { display: flex; justify-content: center; gap: 8px; padding: 8px 12px 2px; }
  .contact-links a {
    display: inline-flex; align-items: center; gap: 5px; text-decoration: none;
    background: var(--accent); color: #fff; font-weight: 700; font-size: 12px;
    padding: 7px 14px; border-radius: 999px;
  }
  .contact-links a.whatsapp { background: #25D366; color: #06341f; }

  .layout { display: flex; flex-direction: column; }

  .categories { display: flex; overflow-x: auto; gap: 8px; padding: 10px 12px; background: #fff; position: sticky; top: 66px; z-index: 15; border-bottom: 1px solid #eee; -webkit-overflow-scrolling: touch; }
  .categories::-webkit-scrollbar { display: none; }
  .categories button { flex: 0 0 auto; white-space: nowrap; border: none; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 12.5px; letter-spacing: 0.02em; text-transform: uppercase; padding: 9px 16px; border-radius: 999px; transition: background 0.15s, color 0.15s; }
  .categories button.active { background: var(--accent); color: #fff; }

  main { padding: 14px 12px 48px; max-width: 900px; margin: 0 auto; flex: 1; min-width: 0; }
  .category-section { scroll-margin-top: 122px; }
  .category-title { font-size: 15px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); font-weight: 700; margin: 26px 4px 12px; }
  .category-section:first-child .category-title { margin-top: 4px; }

  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .card { background: var(--card-bg); border-radius: 14px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.08); display: flex; flex-direction: column; position: relative; }
  .card.bestseller { box-shadow: 0 0 0 2px var(--accent), 0 4px 10px rgba(0,0,0,0.12); }
  .card .thumb { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; background: #ece4d8; display: block; }
  .card .thumb-placeholder { width: 100%; aspect-ratio: 1 / 1; background: #ece4d8; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 24px; font-weight: 700; }
  .card .thumb-carousel { position: relative; width: 100%; aspect-ratio: 1 / 1; overflow: hidden; }
  .card .thumb-scroll { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; width: 100%; height: 100%; scrollbar-width: none; }
  .card .thumb-scroll::-webkit-scrollbar { display: none; }
  .card .thumb-scroll img { flex: 0 0 100%; width: 100%; height: 100%; object-fit: cover; scroll-snap-align: start; background: #ece4d8; }
  .card .thumb-dots { position: absolute; bottom: 6px; left: 0; right: 0; display: flex; justify-content: center; gap: 4px; pointer-events: none; }
  .card .thumb-dot { width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,0.55); box-shadow: 0 0 1px rgba(0,0,0,0.3); transition: background 0.15s, transform 0.15s; }
  .card .thumb-dot.active { background: #fff; transform: scale(1.2); }
  .card-body { padding: 10px 10px 12px; flex: 1; display: flex; flex-direction: column; }
  .card-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 4px; }
  .card-tag { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
  .card-name { font-weight: 600; font-size: 13px; line-height: 1.3; margin-bottom: 4px; }
  .card-desc { font-size: 11px; color: var(--muted); line-height: 1.35; margin-bottom: 6px; }
  .card-allergens { display: flex; flex-wrap: wrap; gap: 3px; margin-bottom: 6px; }
  .card-allergen { font-size: 9.5px; font-weight: 600; padding: 1px 6px; border-radius: 999px; background: #f1ece4; color: var(--muted); white-space: nowrap; }
  .card-price { margin-top: auto; font-weight: 700; font-size: 14.5px; color: var(--accent); }
  .card { cursor: pointer; }

  /* Ficha de producto (modal al hacer clic en una tarjeta) */
  body.modal-open { overflow: hidden; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 100; display: flex; align-items: flex-end; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
  .modal-overlay.open { opacity: 1; pointer-events: auto; }
  .modal-sheet { background: var(--card-bg); width: 100%; max-width: 480px; max-height: 92vh; border-radius: 18px 18px 0 0; overflow-y: auto; -webkit-overflow-scrolling: touch; position: relative; transform: translateY(24px); transition: transform 0.2s; }
  .modal-overlay.open .modal-sheet { transform: translateY(0); }
  .modal-close { position: absolute; top: 10px; right: 10px; z-index: 2; width: 32px; height: 32px; border-radius: 50%; border: none; background: rgba(0,0,0,0.45); color: #fff; font-size: 15px; line-height: 1; display: flex; align-items: center; justify-content: center; }
  .modal-carousel { position: relative; width: 100%; aspect-ratio: 1 / 1; background: #ece4d8; }
  .modal-scroll { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; width: 100%; height: 100%; scrollbar-width: none; }
  .modal-scroll::-webkit-scrollbar { display: none; }
  .modal-scroll img { flex: 0 0 100%; width: 100%; height: 100%; object-fit: cover; scroll-snap-align: start; cursor: zoom-in; }
  .modal-dots { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 5px; }
  .modal-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.55); transition: background 0.15s, transform 0.15s; }
  .modal-dot.active { background: #fff; transform: scale(1.25); }
  .modal-placeholder { width: 100%; aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center; background: #ece4d8; color: var(--muted); font-size: 48px; font-weight: 700; }
  .modal-body { padding: 16px 18px 26px; }
  .modal-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
  .modal-name { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
  .modal-allergens { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; }
  .modal-desc { font-size: 14px; color: var(--text); line-height: 1.5; margin-bottom: 14px; white-space: pre-wrap; }
  .modal-price { font-size: 20px; font-weight: 700; color: var(--accent); }
  @media (min-width: 860px) {
    .modal-overlay { align-items: center; }
    .modal-sheet { border-radius: 18px; max-height: 88vh; }
  }

  /* Foto a pantalla completa con zoom real (pellizcar) al tocar la imagen dentro de la ficha */
  .lightbox { position: fixed; inset: 0; background: #000; z-index: 200; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
  .lightbox.open { opacity: 1; pointer-events: auto; }
  .lightbox img { max-width: 100%; max-height: 100%; }
  .lightbox-close { position: absolute; top: 14px; right: 14px; width: 36px; height: 36px; border-radius: 50%; border: none; background: rgba(255,255,255,0.18); color: #fff; font-size: 17px; }

  .allergen-legend { margin: 32px 4px 0; padding: 14px; background: var(--card-bg); border-radius: 12px; font-size: 11px; color: var(--muted); line-height: 1.6; }
  .allergen-legend strong { display: block; color: var(--text); font-size: 12px; margin-bottom: 6px; }
  .allergen-legend .legend-items { display: flex; flex-wrap: wrap; gap: 6px 12px; }

  .empty, .loading { text-align: center; padding: 60px 20px; color: var(--muted); }

  @media (min-width: 860px) {
    .layout { flex-direction: row; align-items: flex-start; max-width: 1100px; margin: 0 auto; }
    .categories { flex-direction: column; overflow-x: visible; width: 230px; flex-shrink: 0; padding: 16px 12px; position: sticky; top: 78px; border-bottom: none; border-right: 1px solid #eee; height: calc(100vh - 78px); }
    .categories button { text-align: left; border-radius: 10px; padding: 12px 14px; }
    .category-section { scroll-margin-top: 90px; }
    .grid { grid-template-columns: repeat(3, 1fr); }
  }
</style>
</head>
<body>
<header>
  <img id="logoImg" class="logo" style="display:none" alt="">
  <h1 id="companyName">Menú</h1>
  <div class="branch" id="branchName" style="display:none"></div>
  <div class="lang-picker"><select id="langSelect"></select></div>
  <div class="contact-links" id="contactLinks" style="display:none"></div>
</header>
<div class="layout">
  <nav class="categories" id="categories"></nav>
  <main id="main"><div class="loading">Cargando menú…</div></main>
</div>
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-sheet" id="modalSheet"></div>
</div>
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightboxClose" aria-label="Cerrar">✕</button>
  <img id="lightboxImg" src="" alt="">
</div>
<script>
  var SUPABASE_URL = 'https://losbulvhmemptrdjygpu.supabase.co';
  var ANON_KEY = 'sb_publishable_PqNnPS4GKsdJDSn2JtI1oQ_ecsozI1R';
  // Orden pedido: inglés primero, español segundo, el resto detrás.
  var LANGS = {
    "en": "English",
    "es": "Español",
    "it": "Italiano",
    "pt": "Português",
    "da": "Dansk",
    "th": "ภาษาไทย",
    "ru": "Русский",
    "fr": "Français",
    "de": "Deutsch",
    "zh": "中文"
  };
  // Etiquetas de plato: icono + texto por idioma (con fallback a español).
  var TAG_META = {
    picante:      { icon: '🌶️', es: 'Picante',      en: 'Spicy' },
    vegetariano:  { icon: '🌱', es: 'Vegetariano',  en: 'Vegetarian' },
    vegano:       { icon: '🌿', es: 'Vegano',       en: 'Vegan' },
    sin_gluten:   { icon: '🌾', es: 'Sin gluten',   en: 'Gluten-free' },
    recomendado:  { icon: '⭐', es: 'Recomendado',  en: 'Recommended' },
    nuevo:        { icon: '✨', es: 'Nuevo',        en: 'New' }
  };
  // Los 14 alérgenos de declaración obligatoria en la UE (Reglamento
  // 1169/2011) — es información legal, no decorativa, así que se pinta
  // siempre igual de clara aunque no haya traducción completa a los 9
  // idiomas: se usa español/inglés y se cae a español si el idioma
  // actual no está en el diccionario (igual que el resto del menú).
  var ALLERGEN_META = {
    gluten:         { icon: '🌾', es: 'Gluten',        en: 'Gluten' },
    crustaceos:     { icon: '🦐', es: 'Crustáceos',    en: 'Crustaceans' },
    huevos:         { icon: '🥚', es: 'Huevo',         en: 'Egg' },
    pescado:        { icon: '🐟', es: 'Pescado',       en: 'Fish' },
    cacahuetes:     { icon: '🥜', es: 'Cacahuetes',    en: 'Peanuts' },
    soja:           { icon: '🫛', es: 'Soja',          en: 'Soy' },
    lacteos:        { icon: '🥛', es: 'Lácteos',       en: 'Dairy' },
    frutos_cascara: { icon: '🌰', es: 'Frutos secos',  en: 'Tree nuts' },
    apio:           { icon: '🥬', es: 'Apio',          en: 'Celery' },
    mostaza:        { icon: '🟡', es: 'Mostaza',       en: 'Mustard' },
    sesamo:         { icon: '⚪', es: 'Sésamo',        en: 'Sesame' },
    sulfitos:       { icon: '🍷', es: 'Sulfitos',      en: 'Sulphites' },
    altramuces:     { icon: '🫘', es: 'Altramuces',    en: 'Lupin' },
    moluscos:       { icon: '🐚', es: 'Moluscos',      en: 'Molluscs' }
  };
  var ALLERGEN_LEGEND_TITLE = { es: 'Alérgenos (Reglamento UE 1169/2011)', en: 'Allergens (EU Regulation 1169/2011)' };
  var BESTSELLER_LABELS = { es: '★ Más vendidos', en: '★ Best sellers', it: '★ I più venduti', pt: '★ Mais vendidos', fr: '★ Meilleures ventes', de: '★ Bestseller' };
  var BESTSELLER_CATEGORY = '__bestsellers__';
  var CATEGORY_I18N = {};
  var ITEMS = [];
  var CATEGORY_ORDER = [];
  var selectedCategory = null;

  var params = new URLSearchParams(location.search);
  var companyId = params.get('company_id');
  var storeId = params.get('store_id');

  var stored = null;
  try { stored = localStorage.getItem('menuLang'); } catch (e) {}
  var current = stored && LANGS[stored] ? stored : (navigator.language || 'en').slice(0, 2);
  if (!LANGS[current]) current = 'en';

  function fieldFor(item, prefix) {
    var v = item[prefix + '_' + current];
    if (v && String(v).trim().length > 0) return v;
    return item[prefix + '_es'] || '';
  }

  function tagLabel(tag) {
    var meta = TAG_META[tag];
    if (!meta) return null;
    var text = meta[current] || meta.es;
    return meta.icon + ' ' + text;
  }

  function allergenLabel(allergen) {
    var meta = ALLERGEN_META[allergen];
    if (!meta) return null;
    var text = meta[current] || meta.es;
    return meta.icon + ' ' + text;
  }

  // "Sopas" -> "Soups" si ya se tradujo esa categoría (ver
  // menu_category_translations / botón "Traducir categorías" en la
  // app); si no hay traducción todavía, se muestra en español en vez de
  // dejar la sección sin título.
  function categoryLabel(cat) {
    if (cat === BESTSELLER_CATEGORY) return BESTSELLER_LABELS[current] || BESTSELLER_LABELS.es;
    var i18n = CATEGORY_I18N[cat];
    if (i18n && i18n[current] && String(i18n[current]).trim().length > 0) return i18n[current];
    return cat;
  }

  function slugify(cat) {
    return 'cat-' + cat.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
  }

  // Convierte un color hex (#RRGGBB) en un tinte translúcido para usarlo
  // como fondo suave (categorías, etiquetas) a juego con el color de
  // marca de cada sucursal — si no hay color válido, se deja el rojo por
  // defecto que ya tenía el menú.
  function applyThemeColor(hex) {
    if (!hex || !/^#[0-9a-fA-F]{6}$/.test(hex)) return;
    document.documentElement.style.setProperty('--accent', hex);
    var r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    document.documentElement.style.setProperty('--accent-soft', 'rgba(' + r + ',' + g + ',' + b + ',0.12)');
  }

  function renderContactLinks(phone) {
    var wrap = document.getElementById('contactLinks');
    wrap.innerHTML = '';
    if (!phone) { wrap.style.display = 'none'; return; }
    var digits = String(phone).replace(/[^0-9+]/g, '');
    var call = document.createElement('a');
    call.href = 'tel:' + digits;
    call.textContent = '📞 Llamar';
    wrap.appendChild(call);
    var wa = document.createElement('a');
    wa.className = 'whatsapp';
    wa.href = 'https://wa.me/' + digits.replace('+', '');
    wa.target = '_blank';
    wa.rel = 'noopener';
    wa.textContent = '💬 WhatsApp';
    wrap.appendChild(wa);
    wrap.style.display = 'flex';
  }

  function renderLangs() {
    var select = document.getElementById('langSelect');
    select.innerHTML = '';
    Object.keys(LANGS).forEach(function (code) {
      var opt = document.createElement('option');
      opt.value = code;
      opt.textContent = LANGS[code];
      if (code === current) opt.selected = true;
      select.appendChild(opt);
    });
    select.onchange = function () {
      current = select.value;
      try { localStorage.setItem('menuLang', current); } catch (e) {}
      // Antes solo se refrescaba renderContent(): los títulos de sección
      // cambiaban de idioma pero los botones de categoría (barra
      // superior/lateral) se quedaban con el texto del idioma anterior
      // porque los pinta una función aparte, renderCategoryNav().
      renderCategoryNav();
      renderContent();
    };
  }

  function renderCategoryNav() {
    var nav = document.getElementById('categories');
    nav.innerHTML = '';
    CATEGORY_ORDER.forEach(function (cat) {
      var btn = document.createElement('button');
      btn.textContent = categoryLabel(cat);
      btn.dataset.category = cat;
      if (cat === selectedCategory) btn.className = 'active';
      btn.onclick = function () {
        var section = document.getElementById(slugify(cat));
        if (section) section.scrollIntoView({ behavior: 'smooth', block: 'start' });
      };
      nav.appendChild(btn);
    });
  }

  function highlightActiveCategory() {
    var buttons = document.querySelectorAll('#categories button');
    buttons.forEach(function (btn) {
      if (btn.dataset.category === selectedCategory) {
        btn.classList.add('active');
        // Mantiene el botón activo visible dentro de la barra scrollable en móvil.
        if (window.innerWidth < 860 && btn.scrollIntoView) {
          btn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        }
      } else {
        btn.classList.remove('active');
      }
    });
  }

  function buildCard(item) {
    var card = document.createElement('div');
    card.className = 'card' + (item.is_bestseller ? ' bestseller' : '');

    // Hasta 5 fotos por plato (principal + hasta 4 extra, ver
    // extra_photos en la app): con más de una se pinta un carrusel
    // deslizable con puntos indicadores; con una sola o ninguna, se
    // mantiene el comportamiento de siempre (imagen fija o placeholder).
    var images = Array.isArray(item.images) && item.images.length ? item.images : (item.image_url ? [item.image_url] : []);
    if (images.length > 1) {
      var carousel = document.createElement('div');
      carousel.className = 'thumb-carousel';
      var scroller = document.createElement('div');
      scroller.className = 'thumb-scroll';
      images.forEach(function (src) {
        var img = document.createElement('img');
        img.src = src;
        img.loading = 'lazy';
        img.alt = '';
        scroller.appendChild(img);
      });
      carousel.appendChild(scroller);

      var dots = document.createElement('div');
      dots.className = 'thumb-dots';
      images.forEach(function (_, i) {
        var dot = document.createElement('span');
        dot.className = 'thumb-dot' + (i === 0 ? ' active' : '');
        dots.appendChild(dot);
      });
      carousel.appendChild(dots);

      scroller.addEventListener('scroll', function () {
        var idx = Math.round(scroller.scrollLeft / Math.max(scroller.clientWidth, 1));
        Array.prototype.forEach.call(dots.children, function (dot, i) {
          dot.classList.toggle('active', i === idx);
        });
      }, { passive: true });

      card.appendChild(carousel);
    } else if (images.length === 1) {
      var img = document.createElement('img');
      img.className = 'thumb';
      img.src = images[0];
      img.loading = 'lazy';
      img.alt = '';
      card.appendChild(img);
    } else {
      var ph = document.createElement('div');
      ph.className = 'thumb-placeholder';
      ph.textContent = (fieldFor(item, 'name') || '?').charAt(0).toUpperCase();
      card.appendChild(ph);
    }

    var body = document.createElement('div');
    body.className = 'card-body';

    var tags = Array.isArray(item.tags) ? item.tags.slice() : [];
    if (item.is_bestseller) tags = ['recomendado'].concat(tags);
    var tagLabels = tags.map(tagLabel).filter(Boolean);
    if (tagLabels.length) {
      var tagsWrap = document.createElement('div');
      tagsWrap.className = 'card-tags';
      tagLabels.forEach(function (label) {
        var chip = document.createElement('span');
        chip.className = 'card-tag';
        chip.textContent = label;
        tagsWrap.appendChild(chip);
      });
      body.appendChild(tagsWrap);
    }

    var name = document.createElement('div');
    name.className = 'card-name';
    name.textContent = fieldFor(item, 'name');
    body.appendChild(name);

    var allergenLabels = (Array.isArray(item.allergens) ? item.allergens : []).map(allergenLabel).filter(Boolean);
    if (allergenLabels.length) {
      var allergensWrap = document.createElement('div');
      allergensWrap.className = 'card-allergens';
      allergenLabels.forEach(function (label) {
        var badge = document.createElement('span');
        badge.className = 'card-allergen';
        badge.textContent = label;
        allergensWrap.appendChild(badge);
      });
      body.appendChild(allergensWrap);
    }

    var desc = fieldFor(item, 'description');
    if (desc) {
      var descEl = document.createElement('div');
      descEl.className = 'card-desc';
      descEl.textContent = desc;
      body.appendChild(descEl);
    }

    if (item.price !== null && item.price !== undefined) {
      var price = document.createElement('div');
      price.className = 'card-price';
      price.textContent = Number(item.price).toFixed(2).replace('.', ',') + ' €';
      body.appendChild(price);
    }

    card.appendChild(body);
    // Clic en cualquier parte de la tarjeta abre la ficha grande del
    // producto — incluso si el clic cae encima del carrusel de fotos,
    // porque un arrastre real para deslizar entre fotos no dispara
    // "click" en los navegadores (solo un toque suelto lo hace).
    card.addEventListener('click', function () { openDetail(item); });
    return card;
  }

  // Ficha de producto: mismo contenido que la tarjeta pero en grande,
  // con la foto ampliable y la descripción completa sin recortar.
  function openDetail(item) {
    var images = Array.isArray(item.images) && item.images.length ? item.images : (item.image_url ? [item.image_url] : []);
    var sheet = document.getElementById('modalSheet');
    sheet.innerHTML = '';

    var closeBtn = document.createElement('button');
    closeBtn.className = 'modal-close';
    closeBtn.textContent = '✕';
    closeBtn.setAttribute('aria-label', 'Cerrar');
    closeBtn.onclick = closeDetail;
    sheet.appendChild(closeBtn);

    if (images.length) {
      var carousel = document.createElement('div');
      carousel.className = 'modal-carousel';
      var scroller = document.createElement('div');
      scroller.className = 'modal-scroll';
      images.forEach(function (src) {
        var img = document.createElement('img');
        img.src = src;
        img.loading = 'lazy';
        img.alt = '';
        img.addEventListener('click', function (e) {
          e.stopPropagation();
          openLightbox(src);
        });
        scroller.appendChild(img);
      });
      carousel.appendChild(scroller);
      if (images.length > 1) {
        var dots = document.createElement('div');
        dots.className = 'modal-dots';
        images.forEach(function (_, i) {
          var dot = document.createElement('span');
          dot.className = 'modal-dot' + (i === 0 ? ' active' : '');
          dots.appendChild(dot);
        });
        carousel.appendChild(dots);
        scroller.addEventListener('scroll', function () {
          var idx = Math.round(scroller.scrollLeft / Math.max(scroller.clientWidth, 1));
          Array.prototype.forEach.call(dots.children, function (dot, i) {
            dot.classList.toggle('active', i === idx);
          });
        }, { passive: true });
      }
      sheet.appendChild(carousel);
    } else {
      var ph = document.createElement('div');
      ph.className = 'modal-placeholder';
      ph.textContent = (fieldFor(item, 'name') || '?').charAt(0).toUpperCase();
      sheet.appendChild(ph);
    }

    var body = document.createElement('div');
    body.className = 'modal-body';

    var tags = Array.isArray(item.tags) ? item.tags.slice() : [];
    if (item.is_bestseller) tags = ['recomendado'].concat(tags);
    var tagLabels = tags.map(tagLabel).filter(Boolean);
    if (tagLabels.length) {
      var tagsWrap = document.createElement('div');
      tagsWrap.className = 'modal-tags';
      tagLabels.forEach(function (label) {
        var chip = document.createElement('span');
        chip.className = 'card-tag';
        chip.textContent = label;
        tagsWrap.appendChild(chip);
      });
      body.appendChild(tagsWrap);
    }

    var name = document.createElement('div');
    name.className = 'modal-name';
    name.textContent = fieldFor(item, 'name');
    body.appendChild(name);

    var allergenLabels = (Array.isArray(item.allergens) ? item.allergens : []).map(allergenLabel).filter(Boolean);
    if (allergenLabels.length) {
      var allergensWrap = document.createElement('div');
      allergensWrap.className = 'modal-allergens';
      allergenLabels.forEach(function (label) {
        var badge = document.createElement('span');
        badge.className = 'card-allergen';
        badge.textContent = label;
        allergensWrap.appendChild(badge);
      });
      body.appendChild(allergensWrap);
    }

    var desc = fieldFor(item, 'description');
    if (desc) {
      var descEl = document.createElement('div');
      descEl.className = 'modal-desc';
      descEl.textContent = desc;
      body.appendChild(descEl);
    }

    if (item.price !== null && item.price !== undefined) {
      var price = document.createElement('div');
      price.className = 'modal-price';
      price.textContent = Number(item.price).toFixed(2).replace('.', ',') + ' €';
      body.appendChild(price);
    }

    sheet.appendChild(body);

    document.getElementById('modalOverlay').classList.add('open');
    document.body.classList.add('modal-open');
  }

  function closeDetail() {
    document.getElementById('modalOverlay').classList.remove('open');
    document.body.classList.remove('modal-open');
  }

  document.getElementById('modalOverlay').addEventListener('click', function (e) {
    if (e.target.id === 'modalOverlay') closeDetail();
  });

  // Zoom real de la foto (pellizcar con los dedos): el <meta viewport>
  // general trae maximum-scale=1 para que el menú no se desalinee si
  // alguien toca sin querer la pantalla, pero eso también bloquea el
  // pellizco para ampliar. Al abrir la foto a pantalla completa se afloja
  // ese límite solo mientras está abierta, y se restaura al cerrarla.
  var viewportMeta = document.querySelector('meta[name="viewport"]');
  var originalViewportContent = viewportMeta ? viewportMeta.getAttribute('content') : '';
  function openLightbox(src) {
    document.getElementById('lightboxImg').src = src;
    document.getElementById('lightbox').classList.add('open');
    if (viewportMeta) viewportMeta.setAttribute('content', 'width=device-width, initial-scale=1, maximum-scale=4');
  }
  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('open');
    if (viewportMeta) viewportMeta.setAttribute('content', originalViewportContent);
  }
  document.getElementById('lightboxClose').addEventListener('click', function (e) {
    e.stopPropagation();
    closeLightbox();
  });
  document.getElementById('lightbox').addEventListener('click', function (e) {
    if (e.target.id === 'lightbox') closeLightbox();
  });

  // Todas las categorías se pintan seguidas, una tras otra, en una sola
  // página continua (nada de filtrar/ocultar) — al llegar al final de una
  // categoría se sigue directo con la siguiente sin ningún corte. La barra
  // de categorías es solo un atajo para saltar de un salto a una sección,
  // y se resalta sola según por dónde vas scrolleando (ver updateActiveFromScroll).
  // "★ Más vendidos" (si hay) se pinta siempre primero, repitiendo ahí los
  // platos más pedidos además de en su categoría normal — como la "carta
  // recomendada" que suelen destacar los restaurantes físicos.
  function renderContent() {
    var main = document.getElementById('main');
    main.innerHTML = '';

    if (!ITEMS.length) {
      var empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'El menú todavía no tiene platos publicados.';
      main.appendChild(empty);
      return;
    }

    var byCategory = {};
    ITEMS.forEach(function (item) {
      var cat = item.category || 'General';
      (byCategory[cat] = byCategory[cat] || []).push(item);
    });
    var bestsellers = ITEMS.filter(function (item) { return item.is_bestseller; });
    if (bestsellers.length) byCategory[BESTSELLER_CATEGORY] = bestsellers;

    CATEGORY_ORDER.forEach(function (cat) {
      var section = document.createElement('section');
      section.className = 'category-section';
      section.id = slugify(cat);
      section.dataset.category = cat;

      var title = document.createElement('div');
      title.className = 'category-title';
      title.textContent = categoryLabel(cat);
      section.appendChild(title);

      var grid = document.createElement('div');
      grid.className = 'grid';
      (byCategory[cat] || []).forEach(function (item) { grid.appendChild(buildCard(item)); });
      section.appendChild(grid);

      main.appendChild(section);
    });

    var legend = buildAllergenLegend();
    if (legend) main.appendChild(legend);

    highlightActiveCategory();
  }

  // Leyenda de alérgenos al final de la página — solo se pinta si algún
  // plato publicado tiene alguno marcado, para no meter ruido legal en
  // cartas que todavía no los han rellenado.
  function buildAllergenLegend() {
    var used = {};
    ITEMS.forEach(function (item) {
      (Array.isArray(item.allergens) ? item.allergens : []).forEach(function (a) { used[a] = true; });
    });
    var keys = Object.keys(used);
    if (!keys.length) return null;

    var box = document.createElement('div');
    box.className = 'allergen-legend';
    var title = document.createElement('strong');
    title.textContent = ALLERGEN_LEGEND_TITLE[current] || ALLERGEN_LEGEND_TITLE.es;
    box.appendChild(title);
    var itemsWrap = document.createElement('div');
    itemsWrap.className = 'legend-items';
    keys.forEach(function (key) {
      var label = allergenLabel(key);
      if (!label) return;
      var span = document.createElement('span');
      span.textContent = label;
      itemsWrap.appendChild(span);
    });
    box.appendChild(itemsWrap);
    return box;
  }

  var scrollTicking = false;
  function updateActiveFromScroll() {
    var refY = window.innerWidth >= 860 ? 100 : 130;
    var sections = document.querySelectorAll('.category-section');
    var current = null;
    sections.forEach(function (sec) {
      if (sec.getBoundingClientRect().top <= refY) current = sec;
    });
    if (!current) current = sections[0];
    if (current && current.dataset.category !== selectedCategory) {
      selectedCategory = current.dataset.category;
      highlightActiveCategory();
    }
  }
  window.addEventListener('scroll', function () {
    if (!scrollTicking) {
      window.requestAnimationFrame(function () { updateActiveFromScroll(); scrollTicking = false; });
      scrollTicking = true;
    }
  }, { passive: true });

  if (!companyId) {
    document.getElementById('main').innerHTML = '<div class="empty">Falta el identificador de la empresa en el enlace.</div>';
  } else {
    var apiUrl = SUPABASE_URL + '/functions/v1/public-menu?company_id=' + encodeURIComponent(companyId);
    if (storeId) apiUrl += '&store_id=' + encodeURIComponent(storeId);
    // cache: 'no-store' + parámetro de fecha: algunos navegadores móviles
    // (sobre todo Safari en iOS al escanear un QR) ignoran el
    // Cache-Control: no-store que ya manda la función y sirven una copia
    // vieja de la respuesta guardada en su caché HTTP. Añadir un
    // parámetro que cambia en cada carga hace que la URL nunca coincida
    // con nada cacheado, así que siempre pide el dato fresco de verdad.
    apiUrl += (apiUrl.indexOf('?') === -1 ? '?' : '&') + '_=' + Date.now();

    fetch(apiUrl, { cache: 'no-store', headers: { apikey: ANON_KEY, Authorization: 'Bearer ' + ANON_KEY } })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (data.error) {
          document.getElementById('main').innerHTML = '<div class="empty">' + data.error + '</div>';
          return;
        }
        // El título grande es la SUCURSAL (lo que quiere ver el cliente
        // al escanear: "soy Fañabe", "soy El Bodegón"), no el nombre legal
        // de la empresa — solo se cae al nombre de empresa si el enlace
        // no trae sucursal (company_id sin store_id).
        var displayName = data.branch_name || data.company_name || 'Menú';
        document.title = displayName + ' · Menú';
        document.getElementById('companyName').textContent = displayName;
        document.getElementById('branchName').style.display = 'none';

        applyThemeColor(data.theme_color);
        renderContactLinks(data.phone);
        var logoImg = document.getElementById('logoImg');
        if (data.logo_url) {
          logoImg.src = data.logo_url;
          logoImg.style.display = 'block';
        } else {
          logoImg.style.display = 'none';
        }

        ITEMS = data.items || [];

        CATEGORY_I18N = {};
        ITEMS.forEach(function (item) {
          var cat = item.category || 'General';
          if (!CATEGORY_I18N[cat] && item.category_i18n) CATEGORY_I18N[cat] = item.category_i18n;
        });

        var seen = {};
        CATEGORY_ORDER = [];
        if (ITEMS.some(function (item) { return item.is_bestseller; })) {
          CATEGORY_ORDER.push(BESTSELLER_CATEGORY);
          seen[BESTSELLER_CATEGORY] = true;
        }
        ITEMS.forEach(function (item) {
          var cat = item.category || 'General';
          if (!seen[cat]) { seen[cat] = true; CATEGORY_ORDER.push(cat); }
        });
        selectedCategory = CATEGORY_ORDER[0] || null;

        renderLangs();
        renderCategoryNav();
        renderContent();
      })
      .catch(function () {
        document.getElementById('main').innerHTML = '<div class="empty">No se pudo cargar el menú. Comprueba tu conexión.</div>';
      });
  }
</script>
</body>
</html>
