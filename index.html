<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Menú</title>
<style>
  :root {
    color-scheme: light;
    --accent: #c0392b;
    --accent-soft: #fdece7;
    --bg: #f6f2ec;
    --card-bg: #ffffff;
    --text: #2b2320;
    --muted: #8a8078;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); }

  header { position: sticky; top: 0; z-index: 20; background: #2b2320; color: #fff; padding: 14px 16px 10px; text-align: center; }
  header h1 { margin: 0; font-size: 18px; font-weight: 700; }
  header .branch { margin: 2px 0 8px; font-size: 12px; font-weight: 500; color: rgba(255,255,255,0.7); }
  .langs { display: flex; gap: 6px; overflow-x: auto; justify-content: center; padding-bottom: 2px; }
  .langs button { flex: 0 0 auto; border: 1px solid rgba(255,255,255,0.35); background: transparent; color: #fff; padding: 5px 11px; border-radius: 999px; font-size: 12px; }
  .langs button.active { background: #fff; color: #2b2320; font-weight: 600; }

  .layout { display: flex; flex-direction: column; }

  .categories { display: flex; overflow-x: auto; gap: 8px; padding: 10px 12px; background: #fff; position: sticky; top: 66px; z-index: 15; border-bottom: 1px solid #eee; -webkit-overflow-scrolling: touch; }
  .categories::-webkit-scrollbar { display: none; }
  .categories button { flex: 0 0 auto; white-space: nowrap; border: none; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 12.5px; letter-spacing: 0.02em; text-transform: uppercase; padding: 9px 16px; border-radius: 999px; }
  .categories button.active { background: var(--accent); color: #fff; }

  main { padding: 14px 12px 48px; max-width: 900px; margin: 0 auto; }
  .category-title { font-size: 15px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); font-weight: 700; margin: 0 4px 12px; }

  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .card { background: var(--card-bg); border-radius: 14px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.08); display: flex; flex-direction: column; }
  .card .thumb { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; background: #ece4d8; display: block; }
  .card .thumb-placeholder { width: 100%; aspect-ratio: 1 / 1; background: #ece4d8; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 24px; font-weight: 700; }
  .card-body { padding: 10px 10px 12px; flex: 1; display: flex; flex-direction: column; }
  .card-name { font-weight: 600; font-size: 13px; line-height: 1.3; margin-bottom: 4px; }
  .card-desc { font-size: 11px; color: var(--muted); line-height: 1.35; margin-bottom: 6px; }
  .card-price { margin-top: auto; font-weight: 700; font-size: 14.5px; color: var(--accent); }

  .empty, .loading { text-align: center; padding: 60px 20px; color: var(--muted); }

  @media (min-width: 860px) {
    .layout { flex-direction: row; align-items: flex-start; max-width: 1100px; margin: 0 auto; }
    .categories { flex-direction: column; overflow-x: visible; width: 230px; flex-shrink: 0; padding: 16px 12px; position: sticky; top: 78px; border-bottom: none; border-right: 1px solid #eee; height: calc(100vh - 78px); }
    .categories button { text-align: left; border-radius: 10px; padding: 12px 14px; }
    main { flex: 1; }
    .grid { grid-template-columns: repeat(3, 1fr); }
  }
</style>
</head>
<body>
<header>
  <h1 id="companyName">Menú</h1>
  <div class="branch" id="branchName" style="display:none"></div>
  <div class="langs" id="langs"></div>
</header>
<div class="layout">
  <nav class="categories" id="categories"></nav>
  <main id="main"><div class="loading">Cargando menú…</div></main>
</div>
<script>
  var SUPABASE_URL = 'https://losbulvhmemptrdjygpu.supabase.co';
  var ANON_KEY = 'sb_publishable_PqNnPS4GKsdJDSn2JtI1oQ_ecsozI1R';
  var LANGS = {"es":"Español","en":"English","fr":"Français","de":"Deutsch","zh":"中文"};
  var ITEMS = [];
  var CATEGORY_ORDER = [];
  var selectedCategory = null;

  var params = new URLSearchParams(location.search);
  var companyId = params.get('company_id');
  var storeId = params.get('store_id');

  var stored = null;
  try { stored = localStorage.getItem('menuLang'); } catch (e) {}
  var current = stored && LANGS[stored] ? stored : (navigator.language || 'es').slice(0, 2);
  if (!LANGS[current]) current = 'es';

  function fieldFor(item, prefix) {
    var v = item[prefix + '_' + current];
    if (v && String(v).trim().length > 0) return v;
    return item[prefix + '_es'] || '';
  }

  function renderLangs() {
    var langsEl = document.getElementById('langs');
    langsEl.innerHTML = '';
    Object.keys(LANGS).forEach(function (code) {
      var btn = document.createElement('button');
      btn.textContent = LANGS[code];
      if (code === current) btn.className = 'active';
      btn.onclick = function () {
        current = code;
        try { localStorage.setItem('menuLang', code); } catch (e) {}
        renderLangs();
        renderCategories();
        renderGrid();
      };
      langsEl.appendChild(btn);
    });
  }

  function renderCategories() {
    var nav = document.getElementById('categories');
    nav.innerHTML = '';
    CATEGORY_ORDER.forEach(function (cat) {
      var btn = document.createElement('button');
      btn.textContent = cat;
      if (cat === selectedCategory) btn.className = 'active';
      btn.onclick = function () {
        selectedCategory = cat;
        renderCategories();
        renderGrid();
      };
      nav.appendChild(btn);
    });
  }

  function renderGrid() {
    var main = document.getElementById('main');
    main.innerHTML = '';

    if (!ITEMS.length) {
      var empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'El menú todavía no tiene platos publicados.';
      main.appendChild(empty);
      return;
    }

    var title = document.createElement('div');
    title.className = 'category-title';
    title.textContent = selectedCategory;
    main.appendChild(title);

    var grid = document.createElement('div');
    grid.className = 'grid';

    ITEMS.filter(function (item) { return (item.category || 'General') === selectedCategory; })
      .forEach(function (item) {
        var card = document.createElement('div');
        card.className = 'card';

        if (item.image_url) {
          var img = document.createElement('img');
          img.className = 'thumb';
          img.src = item.image_url;
          img.loading = 'lazy';
          img.alt = '';
          card.appendChild(img);
        } else {
          var ph = document.createElement('div');
          ph.className = 'thumb-placeholder';
          ph.textContent = (fieldFor(item, 'name') || '?').charAt(0).toUpperCase();
          card.appendChild(ph);
        }

        var body = document.createElement('div');
        body.className = 'card-body';

        var name = document.createElement('div');
        name.className = 'card-name';
        name.textContent = fieldFor(item, 'name');
        body.appendChild(name);

        var desc = fieldFor(item, 'description');
        if (desc) {
          var descEl = document.createElement('div');
          descEl.className = 'card-desc';
          descEl.textContent = desc;
          body.appendChild(descEl);
        }

        if (item.price !== null && item.price !== undefined) {
          var price = document.createElement('div');
          price.className = 'card-price';
          price.textContent = Number(item.price).toFixed(2).replace('.', ',') + ' €';
          body.appendChild(price);
        }

        card.appendChild(body);
        grid.appendChild(card);
      });

    main.appendChild(grid);
  }

  if (!companyId) {
    document.getElementById('main').innerHTML = '<div class="empty">Falta el identificador de la empresa en el enlace.</div>';
  } else {
    var apiUrl = SUPABASE_URL + '/functions/v1/public-menu?company_id=' + encodeURIComponent(companyId);
    if (storeId) apiUrl += '&store_id=' + encodeURIComponent(storeId);

    fetch(apiUrl, { headers: { apikey: ANON_KEY, Authorization: 'Bearer ' + ANON_KEY } })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (data.error) {
          document.getElementById('main').innerHTML = '<div class="empty">' + data.error + '</div>';
          return;
        }
        document.title = (data.company_name || 'Menú') + ' · Menú';
        document.getElementById('companyName').textContent = data.company_name || 'Menú';
        if (data.branch_name) {
          var b = document.getElementById('branchName');
          b.textContent = data.branch_name;
          b.style.display = '';
        }
        ITEMS = data.items || [];

        var seen = {};
        CATEGORY_ORDER = [];
        ITEMS.forEach(function (item) {
          var cat = item.category || 'General';
          if (!seen[cat]) { seen[cat] = true; CATEGORY_ORDER.push(cat); }
        });
        selectedCategory = CATEGORY_ORDER[0] || null;

        renderLangs();
        renderCategories();
        renderGrid();
      })
      .catch(function () {
        document.getElementById('main').innerHTML = '<div class="empty">No se pudo cargar el menú. Comprueba tu conexión.</div>';
      });
  }
</script>
</body>
</html>
