  // Leyenda de alérgenos al final de la página — solo se pinta si algún
  // plato publicado tiene alguno marcado, para no meter ruido legal en
  // cartas que todavía no los han rellenado.
  function buildAllergenLegend() {
    var used = {};
    ITEMS.forEach(function (item) {
      (Array.isArray(item.allergens) ? item.allergens : []).forEach(function (a) { used[a] = true; });
    });
    var keys = Object.keys(used);
    if (!keys.length) return null;

    var box = document.createElement('div');
    box.className = 'allergen-legend';
    var title = document.createElement('strong');
    title.textContent = ALLERGEN_LEGEND_TITLE[current] || ALLERGEN_LEGEND_TITLE.es;
    box.appendChild(title);
    var itemsWrap = document.createElement('div');
    itemsWrap.className = 'legend-items';
    keys.forEach(function (key) {
      var label = allergenLabel(key);
      if (!label) return;
      var span = document.createElement('span');
      span.textContent = label;
      itemsWrap.appendChild(span);
    });
    box.appendChild(itemsWrap);
    return box;
  }

  var scrollTicking = false;
  var suppressScrollSpyUntil = 0;
  function updateActiveFromScroll() {
    if (Date.now() < suppressScrollSpyUntil) return;
    var refY = window.innerWidth >= 860 ? 100 : 130;
    var sections = document.querySelectorAll('.category-section');
    var current = null;
    sections.forEach(function (sec) {
      if (sec.getBoundingClientRect().top <= refY) current = sec;
    });
    if (!current) current = sections[0];
    if (current && current.dataset.category !== selectedCategory) {
      selectedCategory = current.dataset.category;
      highlightActiveCategory();
    }
  }
  window.addEventListener('scroll', function () {
    if (!scrollTicking) {
      window.requestAnimationFrame(function () { updateActiveFromScroll(); scrollTicking = false; });
      scrollTicking = true;
    }
  }, { passive: true });

  // SEO: meta description dinámica + datos estructurados (JSON-LD,
  // schema.org Restaurant/FoodEstablishment + AggregateRating + Menu).
  // Esta página es una SPA (no hay servidor que genere HTML por plato),
  // pero Googlebot SÍ ejecuta JavaScript y lee el DOM final antes de
  // indexar, así que inyectar esto por JS después de cargar los datos
  // reales funciona igual que si viniera ya en el HTML. Se llama una vez
  // por carga, justo después de recibir la respuesta de public-menu.
  function upsertMeta(name, content) {
    if (!content) return;
    var el = document.querySelector('meta[name="' + name + '"]');
    if (!el) {
      el = document.createElement('meta');
      el.setAttribute('name', name);
      document.head.appendChild(el);
    }
    el.setAttribute('content', content);
  }

  // Igual que upsertMeta, pero para etiquetas Open Graph (og:*), que usan
  // el atributo "property" en vez de "name" — las necesitan Facebook,
  // WhatsApp, etc. para mostrar una vista previa decente al compartir el
  // enlace del menú/mini-web.
  function upsertMetaProperty(property, content) {
    if (!content) return;
    var el = document.querySelector('meta[property="' + property + '"]');
    if (!el) {
      el = document.createElement('meta');
      el.setAttribute('property', property);
      document.head.appendChild(el);
    }
    el.setAttribute('content', content);
  }

  function upsertJsonLd(id, obj) {
    var el = document.getElementById(id);
    if (!el) {
      el = document.createElement('script');
      el.type = 'application/ld+json';
      el.id = id;
      document.head.appendChild(el);
    }
    el.textContent = JSON.stringify(obj);
  }

  function applySeoMetadata(data, displayName) {
    // --- Meta description: descripción SEO del dueño (si existe) + hasta
    // 4 platos destacados + localidad; sin descripción propia, se cae al
    // nombre + localidad como antes ---
    var highlightNames = ITEMS.slice(0, 4).map(function (it) { return fieldFor(it, 'name'); }).filter(Boolean);
    var localityBit = data.city ? (' en ' + data.city) : '';
    var descParts = [data.seo_description || (displayName + localityBit)];
    if (highlightNames.length) descParts.push('Platos: ' + highlightNames.join(', ') + '.');
    var metaDescription = descParts.join('. ').slice(0, 300);
    upsertMeta('description', metaDescription);

    // --- Open Graph / Twitter Card: para que compartir el enlace (en
    // WhatsApp, Facebook, X...) muestre nombre, descripción y foto, no
    // solo la URL pelada ---
    var pageUrlForOg = location.href.split('#')[0];
    upsertMetaProperty('og:type', 'website');
    upsertMetaProperty('og:title', displayName);
    upsertMetaProperty('og:description', metaDescription.slice(0, 200));
    upsertMetaProperty('og:url', pageUrlForOg);
    if (data.logo_url) upsertMetaProperty('og:image', data.logo_url);
    upsertMeta('twitter:card', data.logo_url ? 'summary_large_image' : 'summary');
    upsertMeta('twitter:title', displayName);
    upsertMeta('twitter:description', metaDescription.slice(0, 200));
    if (data.logo_url) upsertMeta('twitter:image', data.logo_url);

    // --- JSON-LD: Restaurant/FoodEstablishment ---
    var pageUrl = location.href.split('#')[0];
    var restaurantSchema = {
      '@context': 'https://schema.org',
      '@type': 'Restaurant',
      '@id': pageUrl,
      name: displayName,
      url: pageUrl
    };
    if (data.logo_url) restaurantSchema.image = data.logo_url;
    if (data.phone) restaurantSchema.telephone = data.phone;
    if (data.address || data.city || data.postal_code) {
      restaurantSchema.address = {
        '@type': 'PostalAddress',
        streetAddress: data.address || undefined,
        addressLocality: data.city || undefined,
        postalCode: data.postal_code || undefined,
        addressCountry: 'ES'
      };
    }
    if (typeof data.rating_avg === 'number' && data.rating_count > 0) {
      restaurantSchema.aggregateRating = {
        '@type': 'AggregateRating',
        ratingValue: Number(data.rating_avg.toFixed(1)),
        reviewCount: data.rating_count
      };
    }

    // --- sameAs: enlaces a los perfiles oficiales de redes sociales —
    // ayuda a Google a asociar esta página con el mismo negocio en
    // Facebook/Instagram/etc. (entity resolution para el Knowledge Panel) ---
    var sameAs = [data.facebook_url, data.instagram_url, data.tiktok_url, data.twitter_url].filter(Boolean);
    if (sameAs.length) restaurantSchema.sameAs = sameAs;

    // --- JSON-LD: Menu / MenuItem, anidado dentro del restaurante ---
    if (ITEMS.length) {
      var menuSections = CATEGORY_ORDER.filter(function (c) { return c !== BESTSELLER_CATEGORY; }).map(function (cat) {
        var sectionItems = ITEMS.filter(function (it) { return (it.category || 'General') === cat; });
        return {
          '@type': 'MenuSection',
          name: cat,
          hasMenuItem: sectionItems.map(function (it) {
            var menuItem = {
              '@type': 'MenuItem',
              name: fieldFor(it, 'name')
            };
            var desc = fieldFor(it, 'description');
            if (desc) menuItem.description = desc;
            if (it.price !== null && it.price !== undefined) {
              menuItem.offers = { '@type': 'Offer', price: Number(it.price).toFixed(2), priceCurrency: 'EUR' };
            }
            if (it.image_url) menuItem.image = it.image_url;
            return menuItem;
          })
        };
      });
      restaurantSchema.hasMenu = {
        '@type': 'Menu',
        '@id': pageUrl + '#menu',
        name: 'Menú de ' + displayName,
        hasMenuSection: menuSections
      };
    }

    upsertJsonLd('ld-restaurant', restaurantSchema);
  }

  // Hero de portada: foto de galería (o logo, o degradado de marca) +
  // nombre + nota REAL de Google + localidad + botones de "Ver carta" /
  // "Reservar". Es lo primero que ve el cliente al entrar en la
  // mini-web, así que se construye siempre que no haya página propia,
  // aunque todavía falten datos de contacto u horario.
  function buildHero(data, displayName) {
    var hero = document.createElement('div');
    hero.className = 'mw-hero';
    hero.id = 'mwHero';
    var bgImage = (Array.isArray(data.gallery_photos) && data.gallery_photos[0]) || data.logo_url || null;
    if (bgImage) hero.style.backgroundImage = 'url(' + bgImage + ')';

    var overlay = document.createElement('div');
    overlay.className = 'mw-hero-overlay';

    // Monograma: logo del negocio o inicial dentro de un aro fino
    var mono = document.createElement('div');
    mono.className = 'mw-mono';
    if (data.logo_url) {
      var mi = document.createElement('img');
      mi.src = data.logo_url; mi.alt = ''; mono.appendChild(mi);
    } else {
      mono.textContent = (displayName || '?').trim().split(/\s+/).slice(0, 2).map(function (w) { return w.charAt(0).toUpperCase(); }).join('');
    }
    overlay.appendChild(mono);

    if (data.city) {
      var locality = document.createElement('div');
      locality.className = 'mw-hero-locality';
      locality.textContent = data.city;
      overlay.appendChild(locality);
    }

    var title = document.createElement('h2');
    title.className = 'mw-hero-title';
    title.textContent = displayName;
    overlay.appendChild(title);

    var orn = document.createElement('div');
    orn.className = 'mw-orn';
    orn.innerHTML = '<i></i><b>◆</b><i></i>';
    overlay.appendChild(orn);

    // Descripción corta (SEO) que el dueño escribe en la app
    if (data.seo_description) {
      var desc = document.createElement('div');
      desc.className = 'mw-hero-desc';
      desc.textContent = data.seo_description;
      overlay.appendChild(desc);
    }

    var cta = document.createElement('div');
    cta.className = 'mw-hero-cta';
    var menuBtn = document.createElement('a');
    menuBtn.className = 'primary';
    menuBtn.href = '#main';
    menuBtn.textContent = uiLabel('heroVerCarta');
    menuBtn.onclick = function (e) {
      e.preventDefault();
      var headerMenuBtn = document.getElementById('headerMenuBtn');
      if (headerMenuBtn && headerMenuBtn.style.display !== 'none') {
        showPage('menu');
        return;
      }
      var main = document.getElementById('main');
      if (main) main.scrollIntoView({ behavior: 'smooth' });
    };
    // "Ver carta" solo en restaurantes; en tiendas/servicios no tiene sentido.
    if (SHOW_MENU) cta.appendChild(menuBtn);

    if (data.phone) {
      var digits = String(data.phone).replace(/[^0-9+]/g, '');
      var waBtn = document.createElement('a');
      waBtn.className = 'whatsapp';
      waBtn.href = 'https://wa.me/' + digits.replace('+', '') + '?text=' + encodeURIComponent(uiLabel('whatsappReserveMsg') + ' ' + displayName);
      waBtn.target = '_blank';
      waBtn.rel = 'noopener';
      waBtn.textContent = uiLabel('heroReservar');
      cta.appendChild(waBtn);
    }
    overlay.appendChild(cta);

    if (typeof data.rating_avg === 'number' && data.rating_count > 0) {
      var ratingChip = document.createElement('div');
      ratingChip.className = 'mw-hero-rating';
      var stars = document.createElement('span');
      stars.className = 'stars';
      var rounded = Math.round(data.rating_avg);
      stars.textContent = '★'.repeat(rounded) + '☆'.repeat(5 - rounded);
      ratingChip.appendChild(stars);
      var ratingText = document.createElement('span');

      overlay.appendChild(ratingChip);
    }

    hero.appendChild(overlay);
    return hero;
  }

  // de página por encima de la carta, porque #miniWeb entero queda antes
  // en el documento aunque el pie no estuviera oculto. Al ser un

      var pri = pPrimaryHref(data, displayName);
      if (pri && /wa\.me/.test(pri.href)) li('WhatsApp', pri.href, true);
      var socs = [[data.instagram_url, 'Instagram'], [data.facebook_url, 'Facebook'], [data.tiktok_url, 'TikTok'], [data.twitter_url, 'X']].filter(function (s) { return s[0]; });
      if (socs.length) {
        var sl = document.createElement('li');
        socs.forEach(function (s, i) {

        });
        ul.appendChild(sl);

      c2.appendChild(ul); wrap.appendChild(c2);

      var ap = [data.address, [data.postal_code, data.city].filter(Boolean).join(' ')].filter(Boolean);

      if (data.opening_hours) {

        c4.appendChild(pEl('h4', 'pf-h', 'Horario'));

        c4.appendChild(p4);
        if (pri && pri.href) { var bw = pEl('div', 'pf-btn'); bw.appendChild(proButton('Escribir por WhatsApp', pri.href, !!pri.blank, 'primary')); c4.appendChild(bw); }
        wrap.appendChild(c4);
      }
      footer.appendChild(wrap);
      footer.appendChild(pEl('div', 'pf-copy', '© ' + new Date().getFullYear() + ' ' + displayName));

    var inner = document.createElement('div');

    var nameEl = document.createElement('div');
    nameEl.className = 'mw-footer-name';
    nameEl.textContent = displayName;
    inner.appendChild(nameEl);

    var addressParts = [data.address, data.postal_code, data.city].filter(Boolean);
    if (addressParts.length) {
      var addr = document.createElement('div');
      addr.className = 'mw-footer-row';
      addr.textContent = '📍 ' + addressParts.join(', ');
      inner.appendChild(addr);
    }
    if (data.phone) {
      var ph = document.createElement('div');
      ph.className = 'mw-footer-row';
      ph.textContent = '📞 ' + data.phone;

    var socials = [

      });

    var copy = document.createElement('div');
    copy.className = 'mw-footer-copy';
    copy.textContent = '© ' + new Date().getFullYear() + ' ' + displayName;
    inner.appendChild(copy);

    footer.appendChild(inner);
    footer.style.display = 'block';

  // Aviso tras un rato de visita: "¿qué tal todo? ¿postre, o nos
  // valoras?" — un empujoncito suave hacia el postre/la reseña sin tener
  // que molestar al personal. Solo en la mini-web avanzada (para no
  // añadir esto a sucursales que no lo pidieron), y solo una vez por
  // visita; si el cliente ya cambió de pestaña/app se espera a que
  // vuelva en vez de disparar en segundo plano.
  var DESSERT_PROMPT_DELAY_MS = 10 * 60 * 1000; // 10 minutos
  var dessertPromptShown = false;

  function scheduleDessertPrompt(data, displayName) {
    if (!data.advanced_web_enabled || dessertPromptShown) return;
    setTimeout(function () {
      if (dessertPromptShown) return;
      if (document.hidden) {
        document.addEventListener('visibilitychange', function onVisible() {
          if (!document.hidden && !dessertPromptShown) {
            showDessertPrompt(displayName);
          }
          document.removeEventListener('visibilitychange', onVisible);
        });
        return;
      }
      showDessertPrompt(displayName);
    }, DESSERT_PROMPT_DELAY_MS);
  }

  function closeDessertPrompt() {
    var el = document.getElementById('dessertPrompt');
    if (!el) return;
    el.classList.remove('open');
    setTimeout(function () { el.remove(); }, 250);
  }

  function showDessertPrompt(displayName) {
    if (document.getElementById('dessertPrompt') || document.getElementById('rateOverlay').classList.contains('open')) return;
    dessertPromptShown = true;
    var el = document.createElement('div');
    el.id = 'dessertPrompt';
    el.className = 'dessert-prompt';
    el.setAttribute('role', 'dialog');
    el.setAttribute('aria-label', uiLabel('dessertText'));
    el.innerHTML =
      '<button class="dessert-prompt-close" aria-label="Cerrar">✕</button>' +
      '<div class="dessert-prompt-icon">🍰</div>' +
      '<div class="dessert-prompt-text"></div>' +
      '<div class="dessert-prompt-actions">' +
      '<button class="dessert-prompt-btn dismiss" id="dessertPromptDismiss"></button>' +
      '<button class="dessert-prompt-btn rate" id="dessertPromptRate"></button>' +
      '</div>';
    el.querySelector('.dessert-prompt-text').textContent = uiLabel('dessertText');
    el.querySelector('#dessertPromptDismiss').textContent = uiLabel('dessertDismiss');
    el.querySelector('#dessertPromptRate').textContent = uiLabel('dessertRate');
    document.body.appendChild(el);
    requestAnimationFrame(function () { el.classList.add('open'); });
    document.getElementById('dessertPromptDismiss').onclick = closeDessertPrompt;
    el.querySelector('.dessert-prompt-close').onclick = closeDessertPrompt;
    document.getElementById('dessertPromptRate').onclick = function () {
      closeDessertPrompt();
      var rateFabBtn = document.getElementById('rateFabBtn');
      if (rateFabBtn) rateFabBtn.click();
    };
  }

  // Chef(es) gigantes y flotantes en Inicio: pegados al borde derecho de
  // la pantalla (mismo lado que el botón de WhatsApp), ocupando casi
  // toda la altura de la pantalla, por delante del resto de la web — pero
  // como hijos de #miniWeb (position:relative) con position:absolute, NO
  // position:fixed, así que al hacer scroll bajan con el resto de la
  // página en vez de quedarse pegados a la pantalla. No importa que la
  // imagen tape texto de debajo (portada, reseñas...): es el efecto
  // buscado. Al tocarla, se oculta (no lleva a ninguna página — la
  // página dedicada del chef sigue accesible desde el menú de
  // navegación). Si ningún chef tiene foto, no se muestra nada.
  function buildChefGiant(chefs) {
    var withPhoto = chefs.filter(function (c) { return c.photo_url; });
    if (!withPhoto.length) return null;
    var wrap = document.createElement('div');
    wrap.className = 'mw-chef-giant';
    wrap.id = 'mwChefGiant';
    withPhoto.slice(0, 2).forEach(function (c) {
      var item = document.createElement('button');
      item.type = 'button';
      item.className = 'mw-chef-giant-item';
      item.setAttribute('aria-label', 'Chef');
      item.onclick = function () { wrap.style.display = 'none'; };
      var img = document.createElement('img');
      img.src = c.photo_url;
      img.alt = 'Chef';
      item.appendChild(img);
      var badge = document.createElement('span');
      badge.className = 'mw-chef-giant-badge';
      badge.textContent = 'Chef';
      item.appendChild(badge);
      wrap.appendChild(item);
    });
    return wrap;
  }

  // Página dedicada al chef (o chefs): foto grande, nombre, biografía y,
  // si hay platos marcados con la etiqueta "especialidad_chef" en el
  // editor de menú, una pequeña selección de esos platos debajo.
  function buildChefPage(chefs) {
    var section = document.createElement('div');
    section.className = 'mini-web-section';
    section.id = 'mwChef';

    var specials = ITEMS.filter(function (it) { return Array.isArray(it.tags) && it.tags.indexOf('especialidad_chef') !== -1; });

    chefs.forEach(function (c) {
      var card = document.createElement('div');
      card.className = 'mw-chef-card';

      var photo = document.createElement('div');
      photo.className = 'mw-chef-photo';
      if (c.photo_url) {
        var img = document.createElement('img');
        img.src = c.photo_url;
        img.alt = c.name;
        photo.appendChild(img);
      } else {
        photo.style.display = 'flex';
        photo.style.alignItems = 'center';
        photo.style.justifyContent = 'center';
        photo.innerHTML = '<span style="font-size:40px;">👨‍🍳</span>';
      }
      card.appendChild(photo);

      var name = document.createElement('div');
      name.className = 'mw-chef-name';
      name.textContent = c.name;
      card.appendChild(name);

      if (c.bio) {
        var bio = document.createElement('div');
        bio.className = 'mw-chef-bio';
        bio.textContent = c.bio;
        card.appendChild(bio);
      }

      section.appendChild(card);
    });

    if (specials.length) {
      var title = document.createElement('div');
      title.className = 'mw-chef-specials-title';
      title.textContent = uiLabel('sectionChefSpecials');
      section.appendChild(title);

      var grid = document.createElement('div');
      grid.className = 'mw-chef-specials';
      specials.forEach(function (it) {
        var card = document.createElement('div');
        card.className = 'card';
        var img = document.createElement('img');
        img.className = 'thumb';
        img.loading = 'lazy';
        img.alt = fieldFor(it, 'name') || '';
        if (it.image_url) img.src = it.image_url; else img.style.display = 'none';
        card.appendChild(img);
        var body = document.createElement('div');
        body.className = 'card-body';
        var nm = document.createElement('div');
        nm.className = 'card-name';
        nm.textContent = fieldFor(it, 'name');
        body.appendChild(nm);
        if (it.price !== null && it.price !== undefined) {
          var price = document.createElement('div');
          price.className = 'card-price';
          price.textContent = Number(it.price).toFixed(2) + ' €';
          body.appendChild(price);
        }
        card.appendChild(body);
        grid.appendChild(card);
      });
      section.appendChild(grid);
    }

    return section;
  }

  // Mini-web: para sucursales sin página propia (website_url vacío), o
  // para cualquiera con la página avanzada activada a propósito (ese
  // interruptor manda sobre el website_url guardado) — hero de portada,
  // contacto/horario/mapa, botón de reservar por WhatsApp o llamada,
  // galería de fotos del local, y 2-3 reseñas reales destacadas. Se
  // inserta entre la cabecera y el menú.
  function renderMiniWeb(data, displayName) {
    var wrap = document.getElementById('miniWeb');
    if (data.website_url && !data.advanced_web_enabled) { wrap.style.display = 'none'; wrap.innerHTML = ''; return; }

    wrap.innerHTML = '';
    wrap.className = 'mini-web';
    // El chef gigante va PRIMERO en el DOM (position:absolute, no ocupa
    // espacio en el flujo) para que quede por delante del hero y de lo
    // que venga justo debajo, pegado al borde derecho.
    var chefGiant = CHEFS.length ? buildChefGiant(CHEFS) : null;
    if (chefGiant) wrap.appendChild(chefGiant);
    if (PRO) {
      renderProHome(wrap, data, displayName);
    } else {
    wrap.appendChild(buildHero(data, displayName));
    var qa = buildQuickActions(data, displayName);
    if (qa) { qa.id = 'mwQuick'; wrap.appendChild(qa); }

        sum.className = 'mw-rv-sum';
        var rs = Math.round(data.rating_avg);
        sum.innerHTML = '<div class="mw-rv-big">' + data.rating_avg.toFixed(1) + '<small>/5</small></div><div class="mw-rv-stars">' + '★'.repeat(rs) + '<span>' + '★'.repeat(5 - rs) + '</span></div>';
        var cnt = document.createElement('div');
        cnt.className = 'mw-rv-count';
        cnt.textContent = data.rating_count + ' ' + uiLabel('reviewsWord') + ' ' + uiLabel('ratingOnGoogle');
        sum.appendChild(cnt);
        reviewsSection.appendChild(sum);
      }
      var rv = document.createElement('div');
      rv.className = 'mw-rv-scroll';
      reviewsSection.appendChild(rv);

      data.reviews_highlight.forEach(function (r) {
        var item = document.createElement('div');
        item.className = 'mini-web-review';
        var stars = document.createElement('div');
        stars.className = 'mini-web-review-stars';
        stars.textContent = '★'.repeat(r.rating) + '☆'.repeat(5 - r.rating);
        item.appendChild(stars);
        var text = document.createElement('div');
        text.className = 'mini-web-review-text';
        text.textContent = '“' + r.comment + '”';
        item.appendChild(text);
        if (r.reviewer_name) {
          var name = document.createElement('div');
          name.className = 'mini-web-review-name';
          name.textContent = '— ' + r.reviewer_name;
          item.appendChild(name);
        }
        rv.appendChild(item);
      });
      wrap.appendChild(reviewsSection);
    }

    if (CHEFS.length) {
      wrap.appendChild(buildChefPage(CHEFS));
    }

    wrap.style.display = 'block';
  }

  if (!companyId && !slug) {
    document.getElementById('main').innerHTML = '<div class="empty"></div>';
    document.querySelector('#main .empty').textContent = uiLabel('missingIdError');
  } else {
    var apiUrl = slug
      ? SUPABASE_URL + '/functions/v1/public-menu?slug=' + encodeURIComponent(slug)
      : SUPABASE_URL + '/functions/v1/public-menu?company_id=' + encodeURIComponent(companyId);
    if (!slug && storeId) apiUrl += '&store_id=' + encodeURIComponent(storeId);
    // Vista previa del diseño con IA (borrador) — ?preview=1 en la URL de la página.
    if (new URLSearchParams(location.search).get('preview') === '1') apiUrl += '&preview=1';
    // cache: 'no-store' + parámetro de fecha: algunos navegadores móviles
    // (sobre todo Safari en iOS al escanear un QR) ignoran el
    // Cache-Control: no-store que ya manda la función y sirven una copia
    // vieja de la respuesta guardada en su caché HTTP. Añadir un
    // parámetro que cambia en cada carga hace que la URL nunca coincida
    // con nada cacheado, así que siempre pide el dato fresco de verdad.
    apiUrl += (apiUrl.indexOf('?') === -1 ? '?' : '&') + '_=' + Date.now();

    fetch(apiUrl, { cache: 'no-store', headers: { apikey: ANON_KEY, Authorization: 'Bearer ' + ANON_KEY } })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (data.error) {
          document.getElementById('main').innerHTML = '<div class="empty">' + data.error + '</div>';
          return;
        }
        // El título grande es la SUCURSAL (lo que quiere ver el cliente
        // al escanear: "soy Fañabe", "soy El Bodegón"), no el nombre legal
        // de la empresa — solo se cae al nombre de empresa si el enlace
        // no trae sucursal (company_id sin store_id).
        var displayName = data.branch_name || data.company_name || 'Menú';
        LAST_DATA = data;
        LAST_DISPLAY_NAME = displayName;
        document.title = displayName + ' · Menú';
        document.getElementById('companyName').textContent = displayName;
        document.getElementById('branchName').style.display = 'none';

        applyThemeColor(data.theme_color);
        SHOW_MENU = data.show_menu !== false;
        PRO = !!(data.design && typeof data.design === 'object');
        applyCustomPalette(data);
        applyDesignTokens(data);
        renderRatingBadge(data);
        renderWhatsappFab(data, displayName);
        renderLangPickerVisibility(data);
        var logoImg = document.getElementById('logoImg');
        if (data.logo_url) {
          logoImg.src = data.logo_url;
          logoImg.alt = 'Logo de ' + displayName;
          logoImg.style.display = 'block';
        } else {
          logoImg.style.display = 'none';
        }

        ITEMS = data.items || [];

        CATEGORY_I18N = {};
        ITEMS.forEach(function (item) {
          var cat = item.category || 'General';
          if (!CATEGORY_I18N[cat] && item.category_i18n) CATEGORY_I18N[cat] = item.category_i18n;
        });

        var seen = {};
        CATEGORY_ORDER = [];
        if (ITEMS.some(function (item) { return item.is_bestseller; })) {
          CATEGORY_ORDER.push(BESTSELLER_CATEGORY);
          seen[BESTSELLER_CATEGORY] = true;
        }
        ITEMS.forEach(function (item) {
          var cat = item.category || 'General';
          if (!seen[cat]) { seen[cat] = true; CATEGORY_ORDER.push(cat); }
        });
        selectedCategory = CATEGORY_ORDER[0] || null;

        STAFF = Array.isArray(data.staff) ? data.staff.filter(function (p) { return p && p.id && p.name; }) : [];
        CHEFS = Array.isArray(data.chefs) ? data.chefs.filter(function (c) { return c && c.id && c.name; }) : [];
        GOOGLE_REVIEW_URL = data.google_review_url || null;

        renderLangs();
        renderCategoryNav();
        renderContent();
        renderRateFab();
        renderBranchSwitcher(data.siblings);
        renderSiteNav(data);
        adjustStickyOffsets();
        applySeoMetadata(data, displayName);
        renderMiniWeb(data, displayName);
        applyDesignContent(data);
        if (PRO) setupProChrome(data, displayName);
        renderFooter(data, displayName);
        scheduleDessertPrompt(data, displayName);
        // Las "páginas" (Inicio/Menú/Horario/Fotos/Mapa) solo existen
        // una vez que renderMiniWeb ha construido sus bloques — por eso
        // esto va al final, después de todo lo demás.
        if (PRO && PAGE_GROUPS.inicio) {
          showPage(currentPageKey || 'inicio', true);
        } else if (data.advanced_web_enabled && document.getElementById('headerMenuBtn').style.display !== 'none') {
          showPage('inicio');
        }
      })
      .catch(function () {
        document.getElementById('main').innerHTML = '<div class="empty"></div>';
        document.querySelector('#main .empty').textContent = uiLabel('loadError');
      });
  }
</script>
</body>
</html>
