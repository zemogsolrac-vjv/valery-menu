  ];
  if (D.opening_hours || mapQuery()) links.push({ href: '#info', icon: '🕒', label: ui('navHorario'), route: 'info' });
  var html = links.map(function (l) { return '<a href="' + l.href + '" class="dlink press flex items-center gap-3 rounded-xl px-3 py-3" data-route="' + l.route + '"><span>' + l.icon + '</span><span>' + esc(l.label) + '</span></a>'; }).join('');
  if (D.google_review_url) html += '<a href="' + esc(D.google_review_url) + '" target="_blank" rel="noopener" class="dlink press flex items-center gap-3 rounded-xl px-3 py-3"><span>⭐</span><span>' + esc(rl('fabLabel')) + '</span></a>';
  var sib = (D.siblings || []).filter(function (s) { return s && s.slug; });
  if (sib.length) {
    html += '<p class="px-3 pb-1 pt-4 text-[10.5px] font-bold uppercase tracking-wider text-ink/40">' + esc(ui('navOtrasSucursales')) + '</p>' +
      sib.map(function (s) { return '<a href="' + esc(basePath + '?slug=' + encodeURIComponent(s.slug)) + '" class="dlink press flex items-center gap-3 rounded-xl px-3 py-3"><span>📍</span><span>' + esc(s.name) + '</span></a>'; }).join('');
  }
  $('#drawerNav').innerHTML = html;
  $$('.dlink').forEach(function (a) { a.addEventListener('click', function () { setDrawer(false); }); });
}

function renderLangs() {
  $('#langWrap').hidden = D.show_lang_picker === false;
  $('#langMenu').innerHTML = Object.keys(LANGS).map(function (k) {
    return '<button role="menuitem" data-lang="' + k + '" class="lang press flex w-full items-center justify-between rounded-xl px-3 py-2.5 text-sm" aria-checked="' + (k === current) + '"><span>' + (LANG_FLAGS[k] || '') + '&nbsp; ' + esc(LANGS[k]) + '</span><i class="tick"></i></button>';
  }).join('');
  $$('.lang').forEach(function (b) { b.addEventListener('click', function () { setLang(b.dataset.lang); toggleLang(false); }); });
}

function renderFabs() {
  var wa = waUrl(), f = $('#fabWa');
  f.hidden = !(wa && D.show_whatsapp_fab !== false); if (wa) f.href = wa;
  $('#fabRateTxt').textContent = rl('fabLabel');
  $('#fabRate').hidden = !(STAFF.length || D.google_review_url);
}

function renderAll() {
  renderBrand(); renderQuick(); renderHome(); renderNav(); renderMenu(); renderDrawer(); renderLangs(); renderFabs();
  spy(); observeReveal();
  if (sheetIdx >= 0) openSheet(sheetIdx, true);
}

function setLang(l) {
  if (l === current) return;
  current = l;
  document.body.classList.add('swap');
  setTimeout(function () { renderAll(); $$('.reveal').forEach(function (el) { el.classList.add('in'); }); requestAnimationFrame(function () { document.body.classList.remove('swap'); }); }, 140);
}

/* ========== FICHA DEL PLATO ========== */
var sheetIdx = -1;
function openSheet(i, silent) {
  var it = ITEMS[i]; if (!it) return;
  sheetIdx = i;
  var n = fieldFor(it, 'name'), d = fieldFor(it, 'description');
  var imgs = (it.images && it.images.length) ? it.images : (it.image_url ? [it.image_url] : []);
  var slides = imgs.map(function (s) { return '<img src="' + esc(s) + '" alt="' + esc(n) + '" class="h-full w-full shrink-0 snap-center object-cover" style="flex:0 0 100%">'; }).join('');
  var chips = chipsFor(it);
  $('#sheetBody').innerHTML =
    '<div class="relative aspect-square w-full overflow-hidden bg-sand">' + (imgs.length ? '<div id="slides" class="no-scrollbar flex h-full snap-x snap-mandatory overflow-x-auto">' + slides + '</div>' : phHtml(n, 'h-full')) +
    (imgs.length > 1 ? '<div class="pointer-events-none absolute inset-x-0 bottom-3 flex justify-center gap-1.5" id="dots">' + imgs.map(function (_, k) { return '<i class="dot ' + (k === 0 ? 'on' : '') + '"></i>'; }).join('') + '</div>' : '') + '</div>' +
    '<div class="px-5 pb-[calc(1.75rem+env(safe-area-inset-bottom))] pt-4"><div class="flex items-start justify-between gap-4"><h3 class="font-display text-[24px] font-semibold leading-tight tracking-tight">' + esc(n) + '</h3>' +
    (typeof it.price === 'number' ? '<span class="bg-accent shrink-0 rounded-full px-3.5 py-1.5 text-[17px] font-semibold tabular-nums text-white shadow-soft">' + money(it.price) + '</span>' : '') + '</div>' +
    (d ? '<p class="mt-2.5 whitespace-pre-line text-[15px] leading-relaxed text-ink/70">' + esc(d) + '</p>' : '') +
    (chips.length ? '<p class="mt-5 text-[11px] font-semibold uppercase tracking-wider text-ink/40">' + esc(tx('allerg')) + '</p><div class="mt-2 flex flex-wrap gap-2">' +
      chips.map(function (c) { return '<span class="flex items-center gap-1.5 rounded-full py-1 pl-2 pr-3 text-[12.5px] font-medium ' + (c.warm ? 'tg-warm' : 'tg-cool') + '"><span>' + c.icon + '</span>' + esc(c.label) + '</span>'; }).join('') + '</div>' : '') + '</div>';
  var sl = $('#slides');
  if (sl) sl.addEventListener('scroll', function () { var k = Math.round(sl.scrollLeft / sl.clientWidth); $$('#dots .dot').forEach(function (x, j) { x.classList.toggle('on', j === k); }); }, { passive: true });
  if (!silent) { $('#sheet').dataset.open = 'true'; $('#sheetScrim').dataset.open = 'true'; $('#sheet').setAttribute('aria-hidden', 'false'); document.body.classList.add('lock'); }
}
function closeSheet() { sheetIdx = -1; $('#sheet').dataset.open = 'false'; $('#sheetScrim').dataset.open = 'false'; $('#sheet').setAttribute('aria-hidden', 'true'); if ($('#rateSheet').dataset.open !== 'true') document.body.classList.remove('lock'); }
$('#menu').addEventListener('click', function (e) { var c = e.target.closest('.card'); if (c) openSheet(+c.dataset.i); });
$('#menu').addEventListener('keydown', function (e) { if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('card')) { e.preventDefault(); openSheet(+e.target.dataset.i); } });
$('#highlights').addEventListener('click', function (e) { var c = e.target.closest('.hl'); if (c) openSheet(+c.dataset.i); });
$('#sheetClose').addEventListener('click', closeSheet);
$('#sheetScrim').addEventListener('click', closeSheet);
$('#gallery').addEventListener('click', function (e) { var im = e.target.closest('.gal-img'); if (im) { $('#lbImg').src = im.dataset.src; $('#lightbox').dataset.open = 'true'; } });
$('#lightbox').addEventListener('click', function () { $('#lightbox').dataset.open = 'false'; });

/* ========== VALÓRANOS (valoración del personal, igual que en la mini-web actual) ========== */
function openRate() { $('#rateSheet').dataset.open = 'true'; $('#rateScrim').dataset.open = 'true'; $('#rateSheet').setAttribute('aria-hidden', 'false'); document.body.classList.add('lock'); }
function closeRate() { $('#rateSheet').dataset.open = 'false'; $('#rateScrim').dataset.open = 'false'; $('#rateSheet').setAttribute('aria-hidden', 'true'); document.body.classList.remove('lock'); }
var avatar = function (p, big) { var s = big ? 'h-32 w-32' : 'h-full w-full'; return p.photo_url ? '<img src="' + esc(p.photo_url) + '" alt="" class="' + s + ' object-cover">' : phHtml(p.name, s); };
function pickStaff() {
  $('#rateBody').innerHTML = '<h3 class="font-display text-[22px] font-semibold">' + esc(rl('pickTitle')) + '</h3><p class="mt-1 text-[13px] text-ink/55">' + esc(rl('pickSub')) + '</p>' +
    '<div class="mt-5 grid grid-cols-3 gap-4">' + STAFF.map(function (p, i) { return '<button class="staff press flex flex-col items-center gap-1.5" data-k="' + i + '"><span class="block aspect-square w-full overflow-hidden rounded-[22px] bg-sand shadow-soft">' + avatar(p) + '</span>' + (p.show_name !== false ? '<span class="text-[11.5px] font-semibold leading-tight">' + esc(p.name) + '</span>' : '') + '</button>'; }).join('') + '</div>';
  $$('.staff').forEach(function (b) { b.addEventListener('click', function () { rateStars(STAFF[+b.dataset.k]); }); });
  openRate();
}
function rateStars(p) {
  var stars = 0;
  $('#rateBody').innerHTML = '<div class="flex flex-col items-center text-center"><span class="block h-32 w-32 overflow-hidden rounded-[32px] bg-sand shadow-lift">' + avatar(p, 1) + '</span><p class="mt-3 font-display text-[18px] font-semibold">' + esc(p.name) + '</p><p class="text-[13px] text-ink/55">' + esc(rl('rateSub')) + '</p>' +
    '<div id="stars" class="mt-3 flex gap-2">' + [1, 2, 3, 4, 5].map(function (n) { return '<button class="star text-[34px] leading-none" data-n="' + n + '" style="color:#e0d9cf">★</button>'; }).join('') + '</div>' +
    '<textarea id="cmt" class="mt-4 min-h-[70px] w-full rounded-2xl border border-black/10 bg-white/70 p-3 text-[14px]" placeholder="' + esc(rl('commentPh')) + '"></textarea>' +
    '<p id="rerr" class="mt-2 hidden text-[12.5px] text-red-700"></p>' +
    '<button id="rsend" class="press mt-4 h-12 w-full rounded-full bg-ink text-[14px] font-semibold text-cream disabled:opacity-50" disabled>' + esc(rl('submit')) + '</button></div>';
  $$('.star').forEach(function (b) { b.addEventListener('click', function () { stars = +b.dataset.n; $$('.star').forEach(function (x) { x.style.color = +x.dataset.n <= stars ? '#f2b544' : '#e0d9cf'; }); $('#rsend').disabled = false; }); });
  $('#rsend').addEventListener('click', function () {
    var btn = $('#rsend'); btn.disabled = true; btn.textContent = rl('sending');
    fetch(SUPABASE_URL + '/functions/v1/submit-employee-rating', { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: ANON_KEY, Authorization: 'Bearer ' + ANON_KEY },
      body: JSON.stringify({ company_id: companyId || D.company_id || null, store_id: storeId || null, slug: slug || null, employee_id: p.id, stars: stars, comment: ($('#cmt').value || '').trim() || null }) })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (r) {
        if (!r.ok || r.d.error) throw new Error('x');
        if (stars === 5 && D.google_review_url) $('#rateBody').innerHTML = '<div class="py-6 text-center"><p class="font-display text-[22px] font-semibold">' + esc(rl('reviewTitle')) + '</p><p class="mt-2 text-[14px] text-ink/60">' + esc(rl('reviewSub')) + '</p><a href="' + esc(D.google_review_url) + '" target="_blank" rel="noopener" class="press mt-5 block rounded-full bg-ink py-3.5 text-[14px] font-semibold text-cream">' + esc(rl('reviewCta')) + '</a><button id="rskip" class="mt-3 text-[13px] text-ink/50">' + esc(rl('reviewSkip')) + '</button></div>';
        else $('#rateBody').innerHTML = '<div class="py-10 text-center"><p class="text-[40px]">🙏</p><p class="mt-2 font-display text-[20px] font-semibold">' + esc(rl('thanks')) + '</p></div>';
        var sk = $('#rskip'); if (sk) sk.addEventListener('click', closeRate);
      })
      .catch(function () { btn.disabled = false; btn.textContent = rl('submit'); var e = $('#rerr'); e.textContent = rl('error'); e.classList.remove('hidden'); });
  });
}
$('#fabRate').addEventListener('click', function () { if (STAFF.length) pickStaff(); else if (D.google_review_url) window.open(D.google_review_url, '_blank', 'noopener'); });
$('#rateClose').addEventListener('click', closeRate);
$('#rateScrim').addEventListener('click', closeRate);

/* ========== DRAWER / IDIOMA / TOAST / COMPARTIR ========== */
function setDrawer(open) { $('#drawer').dataset.open = open; $('#scrim').dataset.open = open; $('#drawer').setAttribute('aria-hidden', !open); $('#burger').setAttribute('aria-expanded', open); }
$('#burger').addEventListener('click', function () { setDrawer(true); });
$('#scrim').addEventListener('click', function () { setDrawer(false); });
$('[data-close]').addEventListener('click', function () { setDrawer(false); });
var menuEl = $('#langMenu'), langBtn = $('#langBtn');
function toggleLang(o) { menuEl.dataset.open = o; langBtn.setAttribute('aria-expanded', o); }
langBtn.addEventListener('click', function (e) { e.stopPropagation(); toggleLang(menuEl.dataset.open !== 'true'); });
document.addEventListener('click', function () { toggleLang(false); });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { toggleLang(false); setDrawer(false); closeSheet(); closeRate(); $('#lightbox').dataset.open = 'false'; } });
var tt;
function toast(m) { var t = $('#toast'); t.textContent = m; t.dataset.open = 'true'; clearTimeout(tt); tt = setTimeout(function () { t.dataset.open = 'false'; }, 1800); }
$('#share').addEventListener('click', function () {
  var data = { title: NAME, url: location.href.split('#')[0] };
  if (navigator.share) navigator.share(data).catch(function () {});
  else { try { navigator.clipboard.writeText(data.url); } catch (e) {} toast(uiRaw('linkCopied')); }
});

/* ========== REVEAL + SCROLL-SPY + RUTAS ========== */
var io, sIO;
function observeReveal() {
  if (io) io.disconnect();
  io = new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }); }, { rootMargin: '0px 0px -6% 0px', threshold: .05 });
  $$('#view-menu .reveal, #view-home .reveal').forEach(function (el) { io.observe(el); });
  // Red de seguridad: lo que ya está en pantalla se muestra aunque el observador tarde
  setTimeout(function () { $$('.reveal:not(.in)').forEach(function (el) { var r = el.getBoundingClientRect(); if (r.width && r.top < innerHeight * 1.1) el.classList.add('in'); }); }, 350);
}
function spy() {
  if (sIO) sIO.disconnect();
  var setActive = function (id) {
    $$('.pill').forEach(function (p) { p.setAttribute('aria-current', p.dataset.id === id); });
    var a = $('#pills .pill[data-id="' + id + '"]'), box = $('#pills');
    if (a && box.scrollWidth > box.clientWidth) box.scrollTo({ left: a.offsetLeft - box.clientWidth / 2 + a.clientWidth / 2, behavior: 'smooth' });
  };
  sIO = new IntersectionObserver(function (es) { es.filter(function (e) { return e.isIntersecting; }).forEach(function (e) { setActive(e.target.id); }); }, { rootMargin: '-' + ($('#top').offsetHeight + 8) + 'px 0px -70% 0px' });
  $$('[data-cat]').forEach(function (s) { sIO.observe(s); });
}
var last = false;
addEventListener('scroll', function () { var y = scrollY > 8; if (y !== last) { last = y; $('#bar').classList.toggle('scrolled', y); } }, { passive: true });

function route() {
  if (!D) return;
  var h = (location.hash || '#inicio').slice(1);
  var isCat = CATEGORY_ORDER.some(function (c) { return slugify(c) === h; });
  var view = (h === 'carta' || isCat) ? 'menu' : 'home';
  var cur = document.body.dataset.view;
  if (cur !== view) {
    document.body.dataset.view = view;
    $$('.view').forEach(function (v) { v.hidden = v.dataset.view !== view; });
    $$('.view:not([hidden]) .reveal').forEach(function (el) { el.classList.remove('in'); });
    requestAnimationFrame(function () { observeReveal(); spy(); });
    scrollTo(0, 0);
  }
  $('#catnav').hidden = view !== 'menu';
  $$('.dlink[data-route]').forEach(function (a) { a.classList.toggle('on', a.dataset.route === view || (h === 'info' && a.dataset.route === 'info')); });
  if (h === 'info') setTimeout(function () { $('#infoSection').scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 60);
  if (isCat) setTimeout(function () { var p = $('#pills .pill[data-id="' + h + '"]'); if (p) p.click(); }, 60);
}
addEventListener('hashchange', route);

/* ========== CARGA DE DATOS ========== */
function fail(msg) { $('#view-home').innerHTML = '<div class="px-8 py-32 text-center text-ink/60">' + esc(msg) + '</div>'; }
function applyTheme(hex) {
  if (!hex || !/^#[0-9a-fA-F]{6}$/.test(hex)) return;
  document.documentElement.style.setProperty('--accent', hex);
}
function seo() {
  var ld = { '@context': 'https://schema.org', '@type': 'Restaurant', name: NAME, image: (D.gallery_photos && D.gallery_photos[0]) || D.logo_url || undefined, telephone: D.phone || undefined, url: location.href.split('#')[0],
    address: D.address ? { '@type': 'PostalAddress', streetAddress: D.address, postalCode: D.postal_code || undefined, addressLocality: D.city || undefined } : undefined,
    aggregateRating: (typeof D.rating_avg === 'number' && D.rating_count > 0) ? { '@type': 'AggregateRating', ratingValue: D.rating_avg, reviewCount: D.rating_count } : undefined, hasMenu: location.href.split('#')[0] };
  var s = document.createElement('script'); s.type = 'application/ld+json'; s.textContent = JSON.stringify(ld); document.head.appendChild(s);
}

if (!companyId && !slug) {
  fail(ui('missingIdError'));
} else {
  var apiUrl = SUPABASE_URL + '/functions/v1/public-menu?' + (slug ? 'slug=' + encodeURIComponent(slug) : 'company_id=' + encodeURIComponent(companyId) + (storeId ? '&store_id=' + encodeURIComponent(storeId) : ''));
  apiUrl += '&_=' + Date.now();
  fetch(apiUrl, { cache: 'no-store', headers: { apikey: ANON_KEY, Authorization: 'Bearer ' + ANON_KEY } })
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (data.error) { fail(data.error); return; }
      D = data;
      NAME = data.branch_name || data.company_name || 'Menú';
      ITEMS = data.items || [];
      CHEFS = Array.isArray(data.chefs) ? data.chefs.filter(function (c) { return c && c.id && c.name; }) : [];
      STAFF = Array.isArray(data.staff) ? data.staff.filter(function (p) { return p && p.id && p.name; }) : [];
      ITEMS.forEach(function (it) { var c = it.category || 'General'; if (!CATEGORY_I18N[c] && it.category_i18n) CATEGORY_I18N[c] = it.category_i18n; });
      var seen = {}; CATEGORY_ORDER = [];
      if (ITEMS.some(function (i) { return i.is_bestseller; })) { CATEGORY_ORDER.push(BESTSELLER_CATEGORY); seen[BESTSELLER_CATEGORY] = 1; }
      ITEMS.forEach(function (it) { var c = it.category || 'General'; if (!seen[c]) { seen[c] = 1; CATEGORY_ORDER.push(c); } });
      applyTheme(data.theme_color);
      renderAll(); seo(); route();
    })
    .catch(function () { fail(ui('loadError')); });
}
</script>
</body>
</html>
