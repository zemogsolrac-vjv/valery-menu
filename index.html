<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menú</title>
<style>
  :root {
    color-scheme: light;
    --accent: #c0392b;
    --accent-soft: #fdece7;
    --bg: #f6f2ec;
    --card-bg: #ffffff;
    --text: #2b2320;
    /* Antes #8a8078 daba un contraste de ~3.9:1 sobre fondo blanco — no
       llega al mínimo de 4.5:1 que pide WCAG AA para texto normal, y en
       esta carta el gris "muted" se usa en textos pequeños (descripción,
       alérgenos). Este tono más oscuro pasa el mínimo sin cambiar
       demasiado el aspecto general. */
    --muted: #6b6259;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); }

  /* Accesibilidad: quien navega con teclado (o con un lector de
     pantalla que también usa el foco) necesita ver claramente dónde
     está — sin esto, tarjetas, botones e iconos no mostraban ningún
     borde al recibir el foco. :focus-visible evita que aparezca el
     contorno al tocar con el dedo/ratón, solo con teclado. */
  a:focus-visible, button:focus-visible, .card:focus-visible, img[role="button"]:focus-visible {
    outline: 3px solid #2b7de9;
    outline-offset: 2px;
  }

  /* Antes el logo iba apilado ENCIMA del título (columna centrada), lo
     que hacía la cabecera muy alta — sobre todo en pantallas anchas
     (escritorio/iPad), donde sobra ancho de sobra pero se desperdiciaba
     en alto. Ahora es una fila: el logo se queda a la izquierda (mismo
     sitio de siempre) centrado verticalmente, y el título/sucursal/
     idioma quedan centrados en el espacio que sobra — así la barra
     ocupa mucho menos alto sin mover el logo del lado izquierdo. */
  header { position: sticky; top: 0; z-index: 20; background: #2b2320; color: #fff; padding: 8px 16px; }
  .header-inner { display: flex; align-items: center; gap: 12px; max-width: 900px; margin: 0 auto; position: relative; }
  header .logo { max-height: 40px; max-width: 120px; object-fit: contain; border-radius: 6px; flex-shrink: 0; margin-bottom: 0; }
  .header-text { flex: 1; min-width: 0; text-align: center; }
  header h1 { margin: 0; font-size: 17px; font-weight: 700; }
  header .branch { margin: 1px 0 0; font-size: 11.5px; font-weight: 500; color: rgba(255,255,255,0.7); }
  /* Selector de idioma: botón flotante fijo abajo a la derecha (como un
     FAB), no dentro de la cabecera — así queda siempre a mano sin
     importar cuánto hayas bajado en la carta, y no ocupa sitio arriba.
     El menú se abre hacia ARRIBA desde el botón (no hacia abajo, porque
     no hay espacio debajo al estar pegado al borde de la pantalla). */
  .lang-picker { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 40; }
  .lang-btn { width: 48px; height: 48px; border-radius: 50%; border: none; background: #2b2320; color: #fff; font-size: 21px; display: flex; align-items: center; justify-content: center; line-height: 1; box-shadow: 0 6px 16px rgba(0,0,0,0.32); }
  .lang-menu { position: absolute; right: 0; bottom: 58px; left: auto; top: auto; transform: translateY(8px); background: #fff; border-radius: 12px; box-shadow: 0 10px 28px rgba(0,0,0,0.28); padding: 6px; width: 190px; max-height: 55vh; overflow-y: auto; z-index: 30; opacity: 0; pointer-events: none; transition: opacity 0.15s, transform 0.15s; }
  .lang-menu.open { opacity: 1; pointer-events: auto; transform: translateY(0); }
  .lang-menu button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px; border: none; background: none; border-radius: 8px; font-size: 13.5px; font-weight: 600; color: var(--text); text-align: left; }
  .lang-menu button.active { background: var(--accent-soft); color: var(--accent); }
  .lang-menu .flag { font-size: 18px; line-height: 1; }
  /* WhatsApp: botón redondo flotante abajo a la derecha, apilado JUSTO
     ENCIMA del selector de idioma (mismo estilo "FAB") — sustituye a las
     píldoras "Llamar"/"WhatsApp" que antes iban debajo del nombre en la
     cabecera, que quedaban recargadas. Solo aparece si la sucursal tiene
     teléfono configurado. */
  .whatsapp-fab { position: fixed; right: 16px; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: 40; }
  .whatsapp-fab-btn { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #25D366; color: #06341f; font-size: 22px; line-height: 1; box-shadow: 0 6px 16px rgba(0,0,0,0.32); text-decoration: none; }

  .layout { display: flex; flex-direction: column; }

  .categories { display: flex; overflow-x: auto; gap: 8px; padding: 10px 12px; background: #fff; position: sticky; top: 52px; z-index: 15; border-bottom: 1px solid #eee; -webkit-overflow-scrolling: touch; }
  .categories::-webkit-scrollbar { display: none; }
  .categories button { flex: 0 0 auto; white-space: nowrap; border: none; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 12.5px; letter-spacing: 0.02em; text-transform: uppercase; padding: 9px 16px; border-radius: 999px; transition: background 0.15s, color 0.15s; }
  .categories button.active { background: var(--accent); color: #fff; }

  /* El padding de abajo es grande a propósito: si la última categoría
     tiene poco contenido, sin este margen la página no puede
     desplazarse lo suficiente para llevar su título hasta la línea que
     usa el scroll-spy, y entonces el resaltado se queda pegado en la
     categoría anterior aunque estés viendo la última. */
  main { padding: 14px 12px calc(45vh); max-width: 900px; margin: 0 auto; flex: 1; min-width: 0; }
  .category-section { scroll-margin-top: 96px; }
  .category-title { font-size: 15px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); font-weight: 700; margin: 26px 4px 12px; }
  .category-section:first-child .category-title { margin-top: 4px; }

  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .card { background: var(--card-bg); border-radius: 14px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.08); display: flex; flex-direction: column; position: relative; }
  .card.bestseller { box-shadow: 0 0 0 2px var(--accent), 0 4px 10px rgba(0,0,0,0.12); }
  .card .thumb { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; background: #ece4d8; display: block; }
  .card .thumb-placeholder { width: 100%; aspect-ratio: 1 / 1; background: #ece4d8; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 24px; font-weight: 700; }
  .card .thumb-carousel { position: relative; width: 100%; aspect-ratio: 1 / 1; overflow: hidden; }
  .card .thumb-scroll { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; width: 100%; height: 100%; scrollbar-width: none; }
  .card .thumb-scroll::-webkit-scrollbar { display: none; }
  .card .thumb-scroll img { flex: 0 0 100%; width: 100%; height: 100%; object-fit: cover; scroll-snap-align: start; background: #ece4d8; }
  .card .thumb-dots { position: absolute; bottom: 6px; left: 0; right: 0; display: flex; justify-content: center; gap: 4px; pointer-events: none; }
  .card .thumb-dot { width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,0.55); box-shadow: 0 0 1px rgba(0,0,0,0.3); transition: background 0.15s, transform 0.15s; }
  .card .thumb-dot.active { background: #fff; transform: scale(1.2); }
  .card-body { padding: 10px 10px 12px; flex: 1; display: flex; flex-direction: column; }
  .card-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 4px; }
  .card-tag { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
  .card-name { font-weight: 600; font-size: 13px; line-height: 1.3; margin-bottom: 4px; }
  .card-desc { font-size: 11px; color: var(--muted); line-height: 1.35; margin-bottom: 6px; }
  .card-allergens { display: flex; flex-wrap: wrap; gap: 3px; margin-bottom: 6px; }
  .card-allergen { font-size: 9.5px; font-weight: 600; padding: 1px 6px; border-radius: 999px; background: #f1ece4; color: var(--muted); white-space: nowrap; }
  .card-price { margin-top: auto; font-weight: 700; font-size: 14.5px; color: var(--accent); }
  .card { cursor: pointer; }

  /* Ficha de producto (modal al hacer clic en una tarjeta) */
  body.modal-open { overflow: hidden; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 100; display: flex; align-items: flex-end; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
  .modal-overlay.open { opacity: 1; pointer-events: auto; }
  .modal-sheet { background: var(--card-bg); width: 100%; max-width: 480px; max-height: 92vh; border-radius: 18px 18px 0 0; overflow-y: auto; -webkit-overflow-scrolling: touch; position: relative; transform: translateY(24px); transition: transform 0.2s; }
  .modal-overlay.open .modal-sheet { transform: translateY(0); }
  .modal-close { position: absolute; top: 10px; right: 10px; z-index: 2; width: 32px; height: 32px; border-radius: 50%; border: none; background: rgba(0,0,0,0.45); color: #fff; font-size: 15px; line-height: 1; display: flex; align-items: center; justify-content: center; }
  .modal-carousel { position: relative; width: 100%; aspect-ratio: 1 / 1; background: #ece4d8; }
  .modal-scroll { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; width: 100%; height: 100%; scrollbar-width: none; }
  .modal-scroll::-webkit-scrollbar { display: none; }
  .modal-scroll img { flex: 0 0 100%; width: 100%; height: 100%; object-fit: cover; scroll-snap-align: start; cursor: zoom-in; }
  .modal-dots { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 5px; }
  .modal-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.55); transition: background 0.15s, transform 0.15s; }
  .modal-dot.active { background: #fff; transform: scale(1.25); }
  .modal-placeholder { width: 100%; aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center; background: #ece4d8; color: var(--muted); font-size: 48px; font-weight: 700; }
  .modal-body { padding: 16px 18px 26px; }
  .modal-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
  .modal-name { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
  .modal-allergens { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; }
  .modal-desc { font-size: 14px; color: var(--text); line-height: 1.5; margin-bottom: 14px; white-space: pre-wrap; }
  .modal-price { font-size: 20px; font-weight: 700; color: var(--accent); }
  @media (min-width: 860px) {
    .modal-overlay { align-items: center; }
    .modal-sheet { border-radius: 18px; max-height: 88vh; }
  }

  /* Foto a pantalla completa con zoom real (pellizcar) al tocar la imagen dentro de la ficha */
  .lightbox { position: fixed; inset: 0; background: #000; z-index: 200; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
  .lightbox.open { opacity: 1; pointer-events: auto; }
  .lightbox img { max-width: 100%; max-height: 100%; }
  .lightbox-close { position: absolute; top: 14px; right: 14px; width: 36px; height: 36px; border-radius: 50%; border: none; background: rgba(255,255,255,0.18); color: #fff; font-size: 17px; }

  /* "Valóranos": botón flotante abajo a la izquierda (el de idioma ya
     ocupa la derecha) que abre la selección de camarero/a + estrellas.
     La foto de cada empleado llega YA recortada sin fondo (PNG con
     alfa, ver EmployeesView.removeBackground en la app) — por eso basta
     con ponerla sobre un círculo de color de marca con sombra para que
     se vea "flotando" en vez de pegada a un fondo cuadrado. */
  .rate-fab { position: fixed; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 40; }
  .rate-fab-btn { display: flex; align-items: center; gap: 6px; height: 48px; padding: 0 16px 0 14px; border-radius: 999px; border: none; background: var(--accent); color: #fff; font-size: 13px; font-weight: 700; box-shadow: 0 6px 16px rgba(0,0,0,0.28); }

  .rate-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100; display: flex; align-items: flex-end; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
  .rate-overlay.open { opacity: 1; pointer-events: auto; }
  .rate-sheet { background: var(--card-bg); width: 100%; max-width: 480px; max-height: 88vh; border-radius: 18px 18px 0 0; overflow-y: auto; -webkit-overflow-scrolling: touch; position: relative; padding: 22px 20px calc(28px + env(safe-area-inset-bottom, 0px)); transform: translateY(24px); transition: transform 0.2s; }
  .rate-overlay.open .rate-sheet { transform: translateY(0); }
  @media (min-width: 860px) {
    .rate-overlay { align-items: center; }
    .rate-sheet { border-radius: 18px; max-height: 84vh; }
  }
  .rate-close { position: absolute; top: 10px; right: 10px; width: 32px; height: 32px; border-radius: 50%; border: none; background: rgba(0,0,0,0.08); color: var(--text); font-size: 15px; line-height: 1; display: flex; align-items: center; justify-content: center; }
  .rate-title { font-size: 18px; font-weight: 700; margin: 4px 30px 4px 0; }
  .rate-subtitle { font-size: 13px; color: var(--muted); margin-bottom: 16px; }

  .rate-staff-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px 10px; }
  .rate-staff-item { display: flex; flex-direction: column; align-items: center; gap: 6px; border: none; background: none; padding: 4px; }
  /* Foto tipo "avatar": marco cuadrado con esquinas redondeadas (no
     círculo, no relleno de color) — se ve bien tanto si la foto ya viene
     recortada sin fondo (PNG transparente) como si es una foto normal sin
     recortar, que es lo más habitual. object-fit: cover rellena todo el
     marco sin dejar huecos ni cortes raros. Solo cuando NO hay foto se
     cae a un círculo con la inicial, que sí necesita su propio fondo. */
  .rate-staff-avatar { width: 100%; aspect-ratio: 1 / 1; border-radius: 22px; overflow: hidden; box-shadow: 0 6px 14px rgba(0,0,0,0.18); background: var(--card-bg); }
  .rate-staff-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .rate-staff-avatar-fallback { width: 100%; aspect-ratio: 1 / 1; border-radius: 22px; background: linear-gradient(160deg, var(--accent), var(--accent-soft)); display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 14px rgba(0,0,0,0.18); }
  .rate-staff-initial { color: #fff; font-size: 30px; font-weight: 700; }
  .rate-staff-name { font-size: 11.5px; font-weight: 600; text-align: center; line-height: 1.25; }

  .rate-selected { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; margin-bottom: 18px; }
  .rate-selected-avatar { width: 150px; height: 150px; border-radius: 32px; overflow: hidden; box-shadow: 0 8px 20px rgba(0,0,0,0.22); background: var(--card-bg); }
  .rate-selected-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .rate-selected-avatar-fallback { width: 150px; height: 150px; border-radius: 32px; background: linear-gradient(160deg, var(--accent), var(--accent-soft)); display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 20px rgba(0,0,0,0.22); }
  .rate-selected-initial { color: #fff; font-size: 44px; font-weight: 700; }
  .rate-selected-name { font-size: 16px; font-weight: 700; }

  .rate-stars { display: flex; justify-content: center; gap: 8px; margin: 6px 0 18px; }
  .rate-star-btn { border: none; background: none; font-size: 34px; line-height: 1; color: #e0d9cf; padding: 4px; }
  .rate-star-btn.filled { color: #f5a623; }

  .rate-comment { width: 100%; min-height: 70px; border: 1px solid #e6ddd0; border-radius: 12px; padding: 10px 12px; font-size: 14px; font-family: inherit; color: var(--text); resize: vertical; background: var(--bg); }
  .rate-submit { width: 100%; margin-top: 14px; height: 46px; border: none; border-radius: 12px; background: var(--accent); color: #fff; font-size: 15px; font-weight: 700; }
  .rate-submit:disabled { opacity: 0.6; }
  .rate-error { color: #c0392b; font-size: 12.5px; margin-top: 8px; text-align: center; }
  .rate-thanks { text-align: center; padding: 30px 10px 10px; }
  .rate-thanks-icon { font-size: 44px; }
  .rate-thanks-text { margin-top: 10px; font-size: 15px; font-weight: 600; }
  .rate-review-sub { margin-top: 8px; font-size: 13.5px; color: var(--muted); line-height: 1.4; }
  .rate-review-cta { display: block; width: 100%; margin-top: 18px; height: 46px; line-height: 46px; border: none; border-radius: 12px; background: var(--accent); color: #fff; font-size: 15px; font-weight: 700; text-align: center; text-decoration: none; }
  .rate-review-skip { display: block; width: 100%; margin-top: 10px; background: none; border: none; color: var(--muted); font-size: 13px; padding: 8px; text-align: center; }

  /* Aviso flotante tras un rato navegando ("¿postre? ¿nos valoras?") —
     no es una notificación push de verdad (eso exigiría pedir permiso y
     un service worker con backend que la dispare; aquí basta con un
     aviso dentro de la propia página, que es lo que de verdad se puede
     hacer sin más infraestructura), pero cumple el mismo papel mientras
     el cliente sigue con la página abierta. */
  .dessert-prompt { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%) translateY(20px); width: calc(100% - 32px); max-width: 420px; background: var(--card-bg); border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); padding: 18px 20px; z-index: 60; opacity: 0; pointer-events: none; transition: opacity 0.25s, transform 0.25s; text-align: center; }
  .dessert-prompt.open { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }
  .dessert-prompt-close { position: absolute; top: 8px; right: 10px; border: none; background: none; color: var(--muted); font-size: 14px; padding: 4px; }
  .dessert-prompt-icon { font-size: 28px; margin-bottom: 6px; }
  .dessert-prompt-text { font-size: 13.5px; color: var(--text); line-height: 1.4; margin-bottom: 14px; }
  .dessert-prompt-actions { display: flex; justify-content: center; gap: 10px; }
  .dessert-prompt-btn { border: none; border-radius: 10px; padding: 10px 16px; font-weight: 700; font-size: 13px; }
  .dessert-prompt-btn.rate { background: var(--accent); color: #fff; }
  .dessert-prompt-btn.dismiss { background: var(--bg); color: var(--muted); }

  .allergen-legend { margin: 32px 4px 0; padding: 14px; background: var(--card-bg); border-radius: 12px; font-size: 11px; color: var(--muted); line-height: 1.6; }
  .allergen-legend strong { display: block; color: var(--text); font-size: 12px; margin-bottom: 6px; }
  .allergen-legend .legend-items { display: flex; flex-wrap: wrap; gap: 6px 12px; }

  /* Mini-web: solo se muestra en sucursales SIN página propia
     (branches.website_url vacío) — ver renderMiniWeb(). Reutiliza el
     mismo lenguaje visual que el resto del menú (tarjetas blancas,
     color de marca) para que no se note como un "añadido" aparte. */
  .mini-web { position: relative; max-width: 900px; margin: 0 auto; padding: 14px 12px 0; }
  .mini-web-section { background: var(--card-bg); border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .mini-web-title { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--accent); margin: 0 0 8px; }
  .mini-web-row { font-size: 13.5px; color: var(--text); line-height: 1.5; }
  .mini-web-row + .mini-web-row { margin-top: 4px; }
  .mini-web-hours { white-space: pre-line; }
  .mini-web-map-link { display: inline-block; margin-top: 8px; font-size: 12.5px; font-weight: 700; color: var(--accent); text-decoration: none; }
  .mini-web-reserve { display: flex; gap: 10px; margin-top: 10px; }
  .mini-web-reserve a { flex: 1; text-align: center; padding: 12px; border-radius: 12px; font-weight: 700; font-size: 13.5px; text-decoration: none; }
  .mini-web-reserve a.whatsapp { background: #25D366; color: #06341f; }
  .mini-web-reserve a.call { background: var(--accent); color: #fff; }
  .mini-web-gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 4px; }
  .mini-web-gallery img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 10px; cursor: zoom-in; }
  .mini-web-review { padding: 8px 0; border-top: 1px solid #f0ece4; }
  .mini-web-review:first-child { border-top: none; padding-top: 0; }
  .mini-web-review-stars { color: #f5a623; font-size: 13px; letter-spacing: 1px; }
  .mini-web-review-text { font-size: 13px; color: var(--muted); line-height: 1.4; margin-top: 2px; font-style: italic; }
  .mini-web-review-name { font-size: 11.5px; font-weight: 700; color: var(--text); margin-top: 3px; }
  .mw-map-frame { width: 100%; height: 220px; border: 0; border-radius: 12px; margin-top: 10px; display: block; }

  /* Pie de página de la mini-web avanzada: nombre + dirección/teléfono
     (NAP, bueno para el SEO local) + iconos de redes sociales (solo las
     que el dueño haya rellenado) — vive dentro de #miniWeb así que
     aparece siempre, sea cual sea la "página" activa (ver PAGE_GROUPS). */
  .mw-footer { background: #2b2320; color: rgba(255,255,255,0.85); border-radius: 14px; padding: 22px 18px; margin: 4px 0 14px; text-align: center; }
  .mw-footer-inner { max-width: 480px; margin: 0 auto; }
  .mw-footer-name { font-size: 15px; font-weight: 700; color: #fff; margin-bottom: 6px; }
  .mw-footer-row { font-size: 12.5px; color: rgba(255,255,255,0.72); margin-top: 4px; }
  .mw-footer-social { display: flex; justify-content: center; gap: 16px; margin-top: 14px; }
  .mw-footer-social a { font-size: 22px; text-decoration: none; line-height: 1; }
  .mw-footer-copy { font-size: 11px; color: rgba(255,255,255,0.45); margin-top: 16px; }

  /* Hero de la mini-web: foto de portada (primera foto de galería, o el

  .mw-hero { position: relative; margin: 0 auto; max-width: 900px; border-radius: 0 0 20px 20px; overflow: hidden; min-height: 260px; display: flex; align-items: flex-end; background: linear-gradient(135deg, var(--accent), #2b2320); background-size: cover; background-position: center; color: #fff; }

     lados). No importa que tape texto de debajo: es el efecto buscado. */

  .mw-chef-giant-item { position: relative; }

  function uiLabel(key) {
    var entry = UI_LABELS[key];
    if (!entry) return '';
    return entry[current] || entry.es;
  }
  var STAFF = [];
  // Chef(es) de la sucursal (empleados marcados "Es chef" en la app),
  // para la foto flotante sobre Inicio y la página dedicada.
  var CHEFS = [];
  // Se guarda la última respuesta del servidor y el nombre a mostrar
  // para poder reconstruir toda la mini-web (textos de interfaz) al
  // cambiar de idioma desde el selector de banderas, sin tener que
  // volver a pedir los datos — ver el onclick de cada idioma más abajo.
  var LAST_DATA = null;
  var LAST_DISPLAY_NAME = null;
  // Enlace de "pedir reseña" de Google de esta sucursal (lo pega el dueño
  // en Valery, ver CompanyBranch.google_review_url) — si existe, a quien
  // valore con 5 estrellas se le invita también a dejar reseña pública.
  var GOOGLE_REVIEW_URL = null;
  var selectedStaff = null;
  var selectedStars = 0;

  var params = new URLSearchParams(location.search);
  var companyId = params.get('company_id');
  var storeId = params.get('store_id');

  // Subdominio por sucursal (ej. elbodegon.valery.menu) en vez de
  // ?company_id=...&store_id=...: si la página no trae company_id en la
  // URL (los QRs/enlaces viejos de GitHub Pages siguen funcionando
  // igual) y el dominio tiene más de 2 partes y no es github.io/
  // localhost, la primera parte del dominio es el slug de la sucursal
  // (branches.slug) — ver public-menu, que lo resuelve a company_id/
  // store_id del lado del servidor. ?slug=... también funciona a mano
  // para pruebas, sea cual sea el dominio.
  var hostParts = location.hostname.split('.');
  var isBareHost = location.hostname === 'localhost' || location.hostname.endsWith('.github.io') || hostParts.length <= 2;
  var slug = params.get('slug') || ((!companyId && !isBareHost && hostParts.length > 2) ? hostParts[0] : null);

  // Base del enlace para saltar a OTRA sucursal (selector de sucursales):
  // quita el último segmento de la ruta actual, sea cual sea su forma
  // ('/valery-menu/' con ?slug=..., o '/valery-menu/el-bodegon' con la
  // URL bonita) — así el enlace siempre apunta a la carpeta del sitio
  // con un solo '?slug=' nuevo, sin arrastrar el de la sucursal actual.
  var basePath = location.pathname.replace(/[^/]*$/, '');

  // Idioma: SIEMPRE el del móvil de quien abre el enlace, cada vez que
  // lo abre — esto es un menú público que ven muchos clientes distintos
  // en el mismo sitio (y a veces en el mismo dispositivo, ej. una
  // tablet en la mesa), así que no debe "recordar" el idioma que eligió
  // el cliente anterior. Si el idioma del móvil no es ninguno de los
  // soportados, se abre en inglés.
  var current = (navigator.language || 'en').slice(0, 2);
  if (!LANGS[current]) current = 'en';
  // Para que un lector de pantalla pronuncie el contenido en el idioma
  // correcto (y no siempre en español, que es lo que decía el <html>
  // por defecto) — se vuelve a actualizar cada vez que se cambia de
  // idioma desde el menú de banderas.
  document.documentElement.lang = current;

  function fieldFor(item, prefix) {
    var v = item[prefix + '_' + current];
    if (v && String(v).trim().length > 0) return v;
    return item[prefix + '_es'] || '';
  }

  function tagLabel(tag) {
    var meta = TAG_META[tag];
    if (!meta) return null;
    var text = meta[current] || meta.es;
    return meta.icon + ' ' + text;
  }

  function allergenLabel(allergen) {
    var meta = ALLERGEN_META[allergen];
    if (!meta) return null;
    var text = meta[current] || meta.es;
    return meta.icon + ' ' + text;
  }

  // "Sopas" -> "Soups" si ya se tradujo esa categoría (ver
  // menu_category_translations / botón "Traducir categorías" en la
  // app); si no hay traducción todavía, se muestra en español en vez de
  // dejar la sección sin título.
  function categoryLabel(cat) {
    if (cat === BESTSELLER_CATEGORY) return BESTSELLER_LABELS[current] || BESTSELLER_LABELS.es;
    var i18n = CATEGORY_I18N[cat];
    if (i18n && i18n[current] && String(i18n[current]).trim().length > 0) return i18n[current];
    return cat;
  }

  function slugify(cat) {
    return 'cat-' + cat.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
  }

  // Convierte un color hex (#RRGGBB) en un tinte translúcido para usarlo
  // como fondo suave (categorías, etiquetas) a juego con el color de
  // marca de cada sucursal — si no hay color válido, se deja el rojo por
  // defecto que ya tenía el menú.
  function applyThemeColor(hex) {
    if (!hex || !/^#[0-9a-fA-F]{6}$/.test(hex)) return;
    document.documentElement.style.setProperty('--accent', hex);
    var r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    document.documentElement.style.setProperty('--accent-soft', 'rgba(' + r + ',' + g + ',' + b + ',0.12)');
  }

  // Mini-web avanzada: colores de fondo/texto propios (si la sucursal los
  // definió y tiene advanced_web_enabled activado) en vez de los de la
  // plantilla por defecto. applyThemeColor (color principal/acento) sigue
  // aplicándose siempre, para todas las sucursales, como hasta ahora.
  function applyCustomPalette(data) {
    if (!data.advanced_web_enabled) return;
    if (data.bg_color && /^#[0-9a-fA-F]{6}$/.test(data.bg_color)) {
      document.documentElement.style.setProperty('--bg', data.bg_color);
    }
    if (data.text_color && /^#[0-9a-fA-F]{6}$/.test(data.text_color)) {
      document.documentElement.style.setProperty('--text', data.text_color);
    }
  }

  // Insignia de la nota de Google en la cabecera ("★★★★★ 4.8/5 en Google
  // · 638 reseñas") — solo en la mini-web avanzada; el resto de
  // sucursales sigue sin mostrarla ahí (aunque siga apareciendo en el
  // hero de la mini-web básica).
  function renderRatingBadge(data) {
    var bar = document.getElementById('ratingBar');
    var badge = document.getElementById('ratingBadge');
    badge.innerHTML = '';
    if (!data.advanced_web_enabled || data.show_rating_badge === false || typeof data.rating_avg !== 'number' || !(data.rating_count > 0)) {
      bar.style.display = 'none';
      return;
    }
    var rounded = Math.round(data.rating_avg);
    var stars = document.createElement('span');
    stars.className = 'stars';
    stars.textContent = '★'.repeat(rounded) + '☆'.repeat(5 - rounded);
    badge.appendChild(stars);
    var text = document.createElement('span');
    text.textContent = data.rating_avg.toFixed(1) + '/5 ' + uiLabel('ratingOnGoogle') + ' · ' + data.rating_count + ' ' + uiLabel('reviewsWord');
    badge.appendChild(text);
    bar.style.display = 'block';
  }

  // Páginas de la mini-web avanzada: en vez de un scroll largo con todo
  // seguido, cada entrada del menú muestra SOLO su bloque y oculta el
  // resto — como páginas separadas de una web normal. Cada clave es un
  // id (o varios) de los bloques que construye renderMiniWeb/el propio
  // HTML; showPage() los intercambia.
  var PAGE_GROUPS = {
    inicio: ['mwHero', 'mwChefGiant', 'mwGallery', 'mwReviews'],
    menu: ['menuLayout'],
    horario: ['mwHours'],
    fotos: ['mwGallery'],
    mapa: ['mwMap'],
    chef: ['mwChef']
  };
  // Qué "página" está activa ahora mismo — se usa para volver a mostrarla
  // tras reconstruir la mini-web entera al cambiar de idioma (ver el
  // onclick del selector de idioma, más abajo).
  var currentPageKey = 'inicio';

  function showPage(key) {
    if (!PAGE_GROUPS[key]) return;
    currentPageKey = key;
    Object.keys(PAGE_GROUPS).forEach(function (k) {
      PAGE_GROUPS[k].forEach(function (id) {
        var el = document.getElementById(id);
        if (el) el.style.display = (k === key) ? '' : 'none';
      });
    });
    document.querySelectorAll('.site-nav-dropdown a[data-page]').forEach(function (a) {
      a.classList.toggle('active', a.dataset.page === key);
    });
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // Menú de navegación "como cualquier web normal" — solo para la
  // mini-web avanzada, y el acceso vive DENTRO de la cabecera (botón de
  // hamburguesa junto al logo, como en cualquier tienda online o web
  // profesional), no en una barra aparte debajo. Al tocarlo se despliega
  // una tarjeta flotante con: Inicio, Menú, Horario, Fotos, Mapa y, si
  // la empresa tiene más de una sucursal con página propia, "Otras
  // sucursales" al final — sustituye aquí al botón-pastilla aparte que
  // había en la cabecera (renderBranchSwitcher sigue existiendo tal
  // cual para las sucursales SIN la mini-web avanzada).
  function renderSiteNav(data) {
    var menuBtn = document.getElementById('headerMenuBtn');
    var spacer = document.getElementById('headerMenuSpacer');
    var dropdown = document.getElementById('siteNavDropdown');
    dropdown.innerHTML = '';
    dropdown.classList.remove('open');

    function hideMenuBtn() { menuBtn.style.display = 'none'; spacer.style.display = 'none'; }

    // Si el dueño activó la página avanzada a propósito, eso manda —
    // aunque la sucursal tenga un website_url guardado (por ejemplo,
    // sincronizado desde la ficha de Google), se usa la página de
    // Valery de todas formas en vez de asumir que "ya tiene web propia".
    if (!data.advanced_web_enabled) { hideMenuBtn(); return; }

    var sections = [{ key: 'inicio', label: uiLabel('navInicio') }];
    if (ITEMS.length) sections.push({ key: 'menu', label: uiLabel('navMenu') });
    if (data.opening_hours || data.phone) sections.push({ key: 'horario', label: uiLabel('navHorario') });
    if (Array.isArray(data.gallery_photos) && data.gallery_photos.length) sections.push({ key: 'fotos', label: uiLabel('navFotos') });
    if (data.address || data.city) sections.push({ key: 'mapa', label: uiLabel('navMapa') });
    if (CHEFS.length) sections.push({ key: 'chef', label: CHEFS.length > 1 ? uiLabel('navChefs') : uiLabel('navChef') });

    var siblings = (Array.isArray(data.siblings) ? data.siblings : []).filter(function (s) { return s && s.slug; });

    if (sections.length < 2 && !siblings.length) { hideMenuBtn(); return; }

    sections.forEach(function (s) {
      var a = document.createElement('a');
      a.href = '#';
      a.textContent = s.label;
      a.dataset.page = s.key;
      a.setAttribute('role', 'menuitem');
      a.onclick = function (e) {
        e.preventDefault();
        showPage(s.key);
        dropdown.classList.remove('open');
        menuBtn.setAttribute('aria-expanded', 'false');
      };
      dropdown.appendChild(a);
    });

    // "Otras sucursales": igual que el selector de cabecera, pero
    // integrado en este mismo menú para no duplicar botones — con un
    // enlace por sucursal hermana que ya tenga slug propio.
    if (siblings.length) {
      var divider = document.createElement('div');
      divider.className = 'site-nav-label';
      divider.textContent = uiLabel('navOtrasSucursales');
      dropdown.appendChild(divider);
      siblings.forEach(function (s) {
        var a = document.createElement('a');
        a.href = basePath + '?slug=' + encodeURIComponent(s.slug);
        a.textContent = s.name || s.slug;
        a.setAttribute('role', 'menuitem');
        dropdown.appendChild(a);
      });
    }

    // Con el menú avanzado ya se cubre el cambio de sucursal, así que se
    // oculta el botón-pastilla aparte de la cabecera para no duplicarlo.
    var switcherWrap = document.getElementById('branchSwitcher');
    if (switcherWrap) switcherWrap.style.display = 'none';

    menuBtn.style.display = 'flex';
    spacer.style.display = 'block';
  }

  document.getElementById('headerMenuBtn').addEventListener('click', function (e) {
    e.stopPropagation();
    var dropdown = document.getElementById('siteNavDropdown');
    var willOpen = !dropdown.classList.contains('open');
    dropdown.classList.toggle('open');
    this.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
  });
  document.addEventListener('click', function (e) {
    var dropdown = document.getElementById('siteNavDropdown');
    var menuBtn = document.getElementById('headerMenuBtn');
    if (dropdown && !dropdown.contains(e.target) && e.target !== menuBtn) {
      dropdown.classList.remove('open');
      if (menuBtn) menuBtn.setAttribute('aria-expanded', 'false');
    }
  });

  // Compartir: en todas las sucursales (no solo la mini-web avanzada),
  // visible en la cabecera sea cual sea la "página" activa. Usa el panel
  // nativo de compartir del móvil (Web Share API) en vez de un enlace
  // de WhatsApp fijo — en iPhone/Android ese panel YA incluye AirDrop,
  // Mensajes, WhatsApp, Correo, etc., así que "acercar dos iPhones" para
  // pasar la carta es, en la práctica, tocar Compartir y elegir AirDrop:
  // no existe una API web para detectar el toque físico entre teléfonos,
  // pero AirDrop (que sí hace eso) aparece ahí como una opción más.
  // Donde no existe este panel (la mayoría de navegadores de escritorio),
  // se cae a copiar el enlace al portapapeles.
  document.getElementById('headerShareBtn').addEventListener('click', function () {
    var name = (document.getElementById('companyName').textContent || 'este sitio').trim();
    var shareData = { title: name, text: uiLabel('shareText') + ' ' + name, url: location.href };
    if (navigator.share) {
      navigator.share(shareData).catch(function () {});
      return;
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(location.href).then(function () {
        alert(uiLabel('linkCopied'));
      }).catch(function () {
        window.open('https://wa.me/?text=' + encodeURIComponent(shareData.text + ' ' + shareData.url), '_blank');
      });
    } else {
      window.open('https://wa.me/?text=' + encodeURIComponent(shareData.text + ' ' + shareData.url), '_blank');
    }
  });

  // La barra de categorías (y el punto donde "engancha" el scroll-spy) da
  // por hecho que justo encima solo hay la cabecera — con el menú de
  // navegación de la mini-web avanzada metido entre medias, hay que
  // correr ese punto hacia abajo lo que mida la barra de navegación, o
  // se queda tapada debajo. Se mide de verdad en vez de usar un número
  // fijo, porque la altura de la cabecera varía (con/sin sucursal,
  // con/sin botones de contacto, etc.).
  function adjustStickyOffsets() {
    var header = document.querySelector('header');
    var ratingBar = document.getElementById('ratingBar');
    var categories = document.getElementById('categories');
    if (!header || !categories) return;
    var offset = header.offsetHeight + ((ratingBar && ratingBar.style.display !== 'none') ? ratingBar.offsetHeight : 0);
    categories.style.top = offset + 'px';
    document.querySelectorAll('.category-section').forEach(function (sec) {
      sec.style.scrollMarginTop = (offset + 24) + 'px';
    });
  }
  window.addEventListener('resize', adjustStickyOffsets);

  function renderWhatsappFab(data, displayName) {
    var wrap = document.getElementById('whatsappFab');
    var btn = document.getElementById('whatsappFabBtn');
    if (!data.phone || data.show_whatsapp_fab === false) { wrap.style.display = 'none'; return; }
    var digits = String(data.phone).replace(/[^0-9+]/g, '');
    btn.href = 'https://wa.me/' + digits.replace('+', '') + '?text=' + encodeURIComponent('Hola, quiero hacer una consulta sobre ' + (displayName || ''));
    wrap.style.display = 'block';
  }

  // Idioma y WhatsApp son los dos botones flotantes de abajo a la
  // derecha, y cada uno es opcional por sucursal — si uno de los dos
  // está apagado, el otro baja a ocupar su sitio en vez de dejar un
  // hueco en el aire.
  function renderLangPickerVisibility(data) {
    var picker = document.querySelector('.lang-picker');
    var langVisible = data.show_lang_picker !== false;
    picker.style.display = langVisible ? '' : 'none';
    var whatsappFab = document.getElementById('whatsappFab');
    whatsappFab.style.bottom = langVisible
      ? 'calc(76px + env(safe-area-inset-bottom, 0px))'
      : 'calc(16px + env(safe-area-inset-bottom, 0px))';
  }

  // Antes era un <select> nativo con los nombres en texto — ahora es un
  // icono de mundo que abre un menú propio con bandera + nombre de cada
  // idioma, más compacto en la cabecera y más fácil de reconocer de un
  // vistazo (sobre todo para un cliente extranjero que no lee español).
  function renderLangs() {
    var btn = document.getElementById('langBtn');
    var menu = document.getElementById('langMenu');
    menu.innerHTML = '';

    Object.keys(LANGS).forEach(function (code) {
      var item = document.createElement('button');
      item.type = 'button';
      item.setAttribute('role', 'menuitem');
      item.className = code === current ? 'active' : '';
      if (code === current) item.setAttribute('aria-current', 'true');
      var flag = document.createElement('span');
      flag.className = 'flag';
      flag.setAttribute('aria-hidden', 'true');
      flag.textContent = LANG_FLAGS[code] || '🏳️';
      var label = document.createElement('span');
      label.textContent = LANGS[code];
      item.appendChild(flag);
      item.appendChild(label);
      item.onclick = function () {
        // No se guarda en localStorage a propósito (ver arriba): este
        // cambio manual solo vale para lo que queda de esta visita, no
        // se queda "pegado" para el siguiente cliente que abra el menú.
        current = code;
        document.documentElement.lang = current;
        closeLangMenu();
        // Antes solo se refrescaba renderContent(): los títulos de sección
        // cambiaban de idioma pero los botones de categoría (barra
        // superior/lateral) se quedaban con el texto del idioma anterior
        // porque los pinta una función aparte, renderCategoryNav().
        renderLangs();
        renderCategoryNav();
        renderContent();
        renderRateFab();
        // El resto de la interfaz de la mini-web avanzada (menú de
        // navegación, portada, horario/mapa/fotos/reseñas, pie de
        // página, página del chef) tiene sus propios textos fijos
        // (ver UI_LABELS) — hay que reconstruirla también, o se quedaría
        // en el idioma con el que cargó la página la primera vez.
        if (LAST_DATA) {
          renderRatingBadge(LAST_DATA);
          renderSiteNav(LAST_DATA);
          renderMiniWeb(LAST_DATA, LAST_DISPLAY_NAME);
          renderFooter(LAST_DATA, LAST_DISPLAY_NAME);
          adjustStickyOffsets();
          var headerMenuBtn = document.getElementById('headerMenuBtn');
          if (LAST_DATA.advanced_web_enabled && headerMenuBtn && headerMenuBtn.style.display !== 'none') {
            showPage(currentPageKey);
          }
        }
      };
      menu.appendChild(item);
    });

    btn.onclick = function (e) {
      e.stopPropagation();
      var willOpen = !menu.classList.contains('open');
      menu.classList.toggle('open');
      btn.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
      if (willOpen) {
        var firstItem = menu.querySelector('button');
        if (firstItem) firstItem.focus();
      }
    };
  }

  // Selector de sucursales: aparece bajo el nombre de empresa cuando
  // public-menu devuelve "siblings" (otras sucursales de la misma
  // empresa que ya tienen slug propio) — permite saltar de la carta/
  // mini-web de una sucursal a otra sin volver atrás ni buscar el
  // enlace. Funciona igual estés viendo el menú digital o la mini-web,
  // porque vive en la cabecera, que es común a las dos vistas.
  function renderBranchSwitcher(siblings) {
    var wrap = document.getElementById('branchSwitcher');
    wrap.innerHTML = '';
    if (!Array.isArray(siblings) || !siblings.length) { wrap.style.display = 'none'; return; }

    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'switcher-btn';
    btn.setAttribute('aria-haspopup', 'true');
    btn.setAttribute('aria-expanded', 'false');
    btn.textContent = '🏠 Otras sucursales ▾';
    wrap.appendChild(btn);

    var menu = document.createElement('div');
    menu.className = 'switcher-menu';
    menu.setAttribute('role', 'menu');
    siblings.forEach(function (s) {
      if (!s || !s.slug) return;
      var a = document.createElement('a');
      a.href = basePath + '?slug=' + encodeURIComponent(s.slug);
      a.setAttribute('role', 'menuitem');
      if (s.logo_url) {
        var img = document.createElement('img');
        img.src = s.logo_url;
        img.alt = '';
        img.loading = 'lazy';
        a.appendChild(img);
      } else {
        var initial = document.createElement('span');
        initial.className = 'switcher-initial';
        initial.textContent = (s.name || '?').trim().charAt(0).toUpperCase();
        a.appendChild(initial);
      }
      var label = document.createElement('span');
      label.textContent = s.name || '';
      a.appendChild(label);
      menu.appendChild(a);
    });
    wrap.appendChild(menu);

    btn.onclick = function (e) {
      e.stopPropagation();
      var willOpen = !menu.classList.contains('open');
      menu.classList.toggle('open');
      btn.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
    };

    wrap.style.display = 'inline-block';
  }

  document.addEventListener('click', function (e) {
    var wrap = document.getElementById('branchSwitcher');
    if (wrap && !wrap.contains(e.target)) {
      var menu = wrap.querySelector('.switcher-menu');
      if (menu) menu.classList.remove('open');
    }
  });

  function closeLangMenu() {
    var menu = document.getElementById('langMenu');
    var btn = document.getElementById('langBtn');
    if (menu) menu.classList.remove('open');
    if (btn) btn.setAttribute('aria-expanded', 'false');
  }

  // Tocar fuera del menú (o desplazar la página) lo cierra, igual que
  // cualquier desplegable nativo — sin esto se quedaba abierto encima
  // del contenido hasta volver a tocar el icono de mundo.
  document.addEventListener('click', function (e) {
    var picker = document.querySelector('.lang-picker');
    if (picker && !picker.contains(e.target)) closeLangMenu();
  });
  window.addEventListener('scroll', closeLangMenu, { passive: true });

  function renderCategoryNav() {
    var nav = document.getElementById('categories');
    nav.innerHTML = '';
    CATEGORY_ORDER.forEach(function (cat) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = categoryLabel(cat);
      btn.dataset.category = cat;
      if (cat === selectedCategory) { btn.className = 'active'; btn.setAttribute('aria-current', 'true'); }
      btn.onclick = function () {
        // Antes esto solo hacía scroll y esperaba a que el listener de
        // scroll (updateActiveFromScroll) detectara sola la sección
        // activa — pero si la categoría es la última de la carta y le
        // sobra poco contenido debajo, la página nunca puede desplazarse
        // lo suficiente para que su título cruce la línea de referencia,
        // así que el scroll-spy se quedaba pensando que seguías en la
        // categoría anterior (ej. tocabas "Carnes" y resaltaba "Arroz").
        // Ahora se marca activa AL TOCAR, sin depender de dónde termine
        // el scroll, y se ignoran los eventos de scroll durante la
        // animación para que no se pise con el resaltado automático.
        selectedCategory = cat;
        highlightActiveCategory();
        suppressScrollSpyUntil = Date.now() + 700;
        var section = document.getElementById(slugify(cat));
        if (section) section.scrollIntoView({ behavior: 'smooth', block: 'start' });
      };
      nav.appendChild(btn);
    });
  }

  function highlightActiveCategory() {
    var buttons = document.querySelectorAll('#categories button');
    buttons.forEach(function (btn) {
      if (btn.dataset.category === selectedCategory) {
        btn.classList.add('active');
        btn.setAttribute('aria-current', 'true');
        // Mantiene el botón activo visible dentro de la barra scrollable en móvil.
        if (window.innerWidth < 860 && btn.scrollIntoView) {
          btn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        }
      } else {
        btn.classList.remove('active');
        btn.removeAttribute('aria-current');
      }
    });
  }

  function buildCard(item) {
    var card = document.createElement('div');
    card.className = 'card' + (item.is_bestseller ? ' bestseller' : '');

    // Hasta 5 fotos por plato (principal + hasta 4 extra, ver
    // extra_photos en la app): con más de una se pinta un carrusel
    // deslizable con puntos indicadores; con una sola o ninguna, se
    // mantiene el comportamiento de siempre (imagen fija o placeholder).
    var images = Array.isArray(item.images) && item.images.length ? item.images : (item.image_url ? [item.image_url] : []);
    if (images.length > 1) {
      var carousel = document.createElement('div');
      carousel.className = 'thumb-carousel';
      var scroller = document.createElement('div');
      scroller.className = 'thumb-scroll';
      images.forEach(function (src) {
        var img = document.createElement('img');
        img.src = src;
        img.loading = 'lazy';
        img.alt = fieldFor(item, 'name') || '';
        scroller.appendChild(img);
      });
      carousel.appendChild(scroller);

      var dots = document.createElement('div');
      dots.className = 'thumb-dots';
      images.forEach(function (_, i) {
        var dot = document.createElement('span');
        dot.className = 'thumb-dot' + (i === 0 ? ' active' : '');
        dots.appendChild(dot);
      });
      carousel.appendChild(dots);

      scroller.addEventListener('scroll', function () {
        var idx = Math.round(scroller.scrollLeft / Math.max(scroller.clientWidth, 1));
        Array.prototype.forEach.call(dots.children, function (dot, i) {
          dot.classList.toggle('active', i === idx);
        });
      }, { passive: true });

      card.appendChild(carousel);
    } else if (images.length === 1) {
      var img = document.createElement('img');
      img.className = 'thumb';
      img.src = images[0];
      img.loading = 'lazy';
      img.alt = fieldFor(item, 'name') || '';
      card.appendChild(img);
    } else {
      var ph = document.createElement('div');
      ph.className = 'thumb-placeholder';
      ph.setAttribute('aria-hidden', 'true');
      ph.textContent = (fieldFor(item, 'name') || '?').charAt(0).toUpperCase();
      card.appendChild(ph);
    }

    var body = document.createElement('div');
    body.className = 'card-body';

    var tags = Array.isArray(item.tags) ? item.tags.slice() : [];
    if (item.is_bestseller) tags = ['recomendado'].concat(tags);
    var tagLabels = tags.map(tagLabel).filter(Boolean);
    if (tagLabels.length) {
      var tagsWrap = document.createElement('div');
      tagsWrap.className = 'card-tags';
      tagLabels.forEach(function (label) {
        var chip = document.createElement('span');
        chip.className = 'card-tag';
        chip.textContent = label;
        tagsWrap.appendChild(chip);
      });
      body.appendChild(tagsWrap);
    }

    var name = document.createElement('div');
    name.className = 'card-name';
    name.textContent = fieldFor(item, 'name');
    body.appendChild(name);

    var allergenLabels = (Array.isArray(item.allergens) ? item.allergens : []).map(allergenLabel).filter(Boolean);
    if (allergenLabels.length) {
      var allergensWrap = document.createElement('div');
      allergensWrap.className = 'card-allergens';
      allergenLabels.forEach(function (label) {
        var badge = document.createElement('span');
        badge.className = 'card-allergen';
        badge.textContent = label;
        allergensWrap.appendChild(badge);
      });
      body.appendChild(allergensWrap);
    }

    var desc = fieldFor(item, 'description');
    if (desc) {
      var descEl = document.createElement('div');
      descEl.className = 'card-desc';
      descEl.textContent = desc;
      body.appendChild(descEl);
    }

    if (item.price !== null && item.price !== undefined) {
      var price = document.createElement('div');
      price.className = 'card-price';
      price.textContent = Number(item.price).toFixed(2).replace('.', ',') + ' €';
      body.appendChild(price);
    }

    card.appendChild(body);
    // Clic en cualquier parte de la tarjeta abre la ficha grande del
    // producto — incluso si el clic cae encima del carrusel de fotos,
    // porque un arrastre real para deslizar entre fotos no dispara
    // "click" en los navegadores (solo un toque suelto lo hace).
    card.addEventListener('click', function () { openDetail(item); });
    // Accesibilidad: la tarjeta es un <div>, así que sin esto quedaba
    // invisible para quien navega con teclado o lector de pantalla (no
    // se podía llegar a ella con Tab ni activarla sin un ratón/dedo).
    card.tabIndex = 0;
    card.setAttribute('role', 'button');
    var priceLabel = (item.price !== null && item.price !== undefined) ? ', ' + Number(item.price).toFixed(2).replace('.', ',') + ' euros' : '';
    card.setAttribute('aria-label', 'Ver ficha de ' + (fieldFor(item, 'name') || 'plato') + priceLabel);
    card.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        openDetail(item);
      }
    });
    return card;
  }

  // Ficha de producto: mismo contenido que la tarjeta pero en grande,
  // con la foto ampliable y la descripción completa sin recortar.
  function openDetail(item) {
    var images = Array.isArray(item.images) && item.images.length ? item.images : (item.image_url ? [item.image_url] : []);
    var sheet = document.getElementById('modalSheet');
    sheet.innerHTML = '';

    var closeBtn = document.createElement('button');
    closeBtn.className = 'modal-close';
    closeBtn.textContent = '✕';
    closeBtn.setAttribute('aria-label', 'Cerrar');
    closeBtn.onclick = closeDetail;
    sheet.appendChild(closeBtn);

    if (images.length) {
      var carousel = document.createElement('div');
      carousel.className = 'modal-carousel';
      var scroller = document.createElement('div');
      scroller.className = 'modal-scroll';
      images.forEach(function (src) {
        var img = document.createElement('img');
        img.src = src;
        img.loading = 'lazy';
        img.alt = fieldFor(item, 'name') || '';
        img.setAttribute('role', 'button');
        img.tabIndex = 0;
        img.setAttribute('aria-label', 'Ampliar foto de ' + (fieldFor(item, 'name') || 'el plato'));
        img.addEventListener('click', function (e) {
          e.stopPropagation();
          openLightbox(src, fieldFor(item, 'name'));
        });
        img.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            e.stopPropagation();
            openLightbox(src, fieldFor(item, 'name'));
          }
        });
        scroller.appendChild(img);
      });
      carousel.appendChild(scroller);
      if (images.length > 1) {
        var dots = document.createElement('div');
        dots.className = 'modal-dots';
        images.forEach(function (_, i) {
          var dot = document.createElement('span');
          dot.className = 'modal-dot' + (i === 0 ? ' active' : '');
          dots.appendChild(dot);
        });
        carousel.appendChild(dots);
        scroller.addEventListener('scroll', function () {
          var idx = Math.round(scroller.scrollLeft / Math.max(scroller.clientWidth, 1));
          Array.prototype.forEach.call(dots.children, function (dot, i) {
            dot.classList.toggle('active', i === idx);
          });
        }, { passive: true });
      }
      sheet.appendChild(carousel);
    } else {
      var ph = document.createElement('div');
      ph.className = 'modal-placeholder';
      ph.setAttribute('aria-hidden', 'true');
      ph.textContent = (fieldFor(item, 'name') || '?').charAt(0).toUpperCase();
      sheet.appendChild(ph);
    }

    var body = document.createElement('div');
    body.className = 'modal-body';

    var tags = Array.isArray(item.tags) ? item.tags.slice() : [];
    if (item.is_bestseller) tags = ['recomendado'].concat(tags);
    var tagLabels = tags.map(tagLabel).filter(Boolean);
    if (tagLabels.length) {
      var tagsWrap = document.createElement('div');
      tagsWrap.className = 'modal-tags';
      tagLabels.forEach(function (label) {
        var chip = document.createElement('span');
        chip.className = 'card-tag';
        chip.textContent = label;
        tagsWrap.appendChild(chip);
      });
      body.appendChild(tagsWrap);
    }

    var name = document.createElement('div');
    name.className = 'modal-name';
    name.textContent = fieldFor(item, 'name');
    body.appendChild(name);

    var allergenLabels = (Array.isArray(item.allergens) ? item.allergens : []).map(allergenLabel).filter(Boolean);
    if (allergenLabels.length) {
      var allergensWrap = document.createElement('div');
      allergensWrap.className = 'modal-allergens';
      allergenLabels.forEach(function (label) {
        var badge = document.createElement('span');
        badge.className = 'card-allergen';
        badge.textContent = label;
        allergensWrap.appendChild(badge);
      });
      body.appendChild(allergensWrap);
    }

    var desc = fieldFor(item, 'description');
    if (desc) {
      var descEl = document.createElement('div');
      descEl.className = 'modal-desc';
      descEl.textContent = desc;
      body.appendChild(descEl);
    }

    if (item.price !== null && item.price !== undefined) {

      fetch(apiUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', apikey: ANON_KEY, Authorization: 'Bearer ' + ANON_KEY },

          company_id: companyId,

          employee_id: person.id,
          stars: selectedStars,
          comment: comment.value.trim() || null,
        }),
      })
        .then(function (res) { return res.json().then(function (data) { return { ok: res.ok, data: data }; }); })
        .then(function (result) {
          if (!result.ok || result.data.error) throw new Error(result.data.error || 'error');
          if (selectedStars === 5 && GOOGLE_REVIEW_URL) {

  // Todas las categorías se pintan seguidas, una tras otra, en una sola
  // página continua (nada de filtrar/ocultar) — al llegar al final de una
  // categoría se sigue directo con la siguiente sin ningún corte. La barra
  // de categorías es solo un atajo para saltar de un salto a una sección,
  // y se resalta sola según por dónde vas scrolleando (ver updateActiveFromScroll).
  // "★ Más vendidos" (si hay) se pinta siempre primero, repitiendo ahí los
  // platos más pedidos además de en su categoría normal — como la "carta
  // recomendada" que suelen destacar los restaurantes físicos.
  function renderContent() {
    var main = document.getElementById('main');
    main.innerHTML = '';

    if (!ITEMS.length) {
      var empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = uiLabel('noItemsYet');

    }

    var byCategory = {};
    ITEMS.forEach(function (item) {
      var cat = item.category || 'General';
      (byCategory[cat] = byCategory[cat] || []).push(item);
    });
    var bestsellers = ITEMS.filter(function (item) { return item.is_bestseller; });
    if (bestsellers.length) byCategory[BESTSELLER_CATEGORY] = bestsellers;

    CATEGORY_ORDER.forEach(function (cat) {
      var section = document.createElement('section');

      section.dataset.category = cat;

      title.className = 'category-title';
      title.textContent = categoryLabel(cat);
      section.appendChild(title);

      var grid = document.createElement('div');
      grid.className = 'grid';
      (byCategory[cat] || []).forEach(function (item) { grid.appendChild(buildCard(item)); });
      section.appendChild(grid);

      main.appendChild(section);
    });

    var legend = buildAllergenLegend();
    if (legend) main.appendChild(legend);

    highlightActiveCategory();
